[project]
name = "finum"
version = "0.1.0"
description = "Numerical channel for the functional-inequalities open targets: refine statements (Parts II & III) and gate/refute proof routes (Part III). Refutes and directs; never proves."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",   # eigh_tridiagonal for the 1D weighted-Poincare FEM gap (A3/A5)
]

[project.scripts]
finum = "finum.__main__:main"

[dependency-groups]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["finum"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
markers = [
    "slow: expensive Monte Carlo or high-resolution numerical regression",
]
