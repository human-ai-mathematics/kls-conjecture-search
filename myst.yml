# The MyST project: the manuscript (modules/) and the full proofs (solutions/).
#
#   npx myst start           # read it locally, live
#   npx myst build --html    # the static site, as pages.yml publishes it
#
# `uv run scripts/check.py` builds the project and reads its AST: every labelled claim
# directive under modules/ is a ledger node with the same id.
version: 1
project:
  title: The KLS theorem and its methods
  github: https://github.com/human-ai-mathematics/kls-conjecture-search
  subtitle: Three proofs of the Kannan–Lovász–Simonovits bound, checked and compared, and the methods around them
  # Text under CC BY 4.0, code under MIT: see LICENSE.
  license:
    content: CC-BY-4.0
    code: MIT
  # The maintainer runs the repository; the work is open to collaboration, and
  # contributors are credited in its history.
  authors:
    - name: Nicolas Brosse
      roles: [Project administration]
    - name:
        literal: Numina Collaboration
  # The shared bibliography. A literature node's `references:` keys must
  # exist here. It ships empty: MyST refuses a .bib holding only comments.
  bibliography:
    - references.bib
  # Macros for every module and dossier. A fixed normalization is a `definition` node,
  # not only a macro.
  math:
    # --- core macros (domain-neutral)
    '\R': '\mathbb{R}'
    '\E': '\mathbb{E}'
    '\Prob': '\mathbb{P}'
    '\one': '\mathbf{1}'
    '\eps': '\varepsilon'
    '\dd': '\,\mathrm{d}'
    '\norm': '\left\lVert #1\right\rVert'
    '\abs': '\left\lvert #1\right\rvert'
    '\inner': '\left\langle #1,#2\right\rangle'
    # --- program macros (from the LaTeX preamble of kls v0.1)
    '\Aop': '\mathsf A'
    '\calB': '\mathcal B'
    '\calD': '\mathcal D'
    '\calE': '\mathcal E'
    '\calI': '\mathcal I'
    '\calJ': '\mathcal J'
    '\calK': '\mathcal K'
    '\calL': '\mathcal L'
    '\calM': '\mathcal M'
    '\calQ': '\mathcal Q'
    '\calR': '\mathcal R'
    '\calS': '\mathcal S'
    '\calT': '\mathcal T'
    '\CLS': 'C_{\mathrm{LS}}'
    '\CMH': 'C_{\mathrm{CMH}}'
    '\Cov': '\operatorname{Cov}'
    '\CP': 'C_{\mathrm P}'
    '\CPaff': 'C_{\mathrm P}^{\mathrm{aff}}'
    '\CTCI': 'C_{\mathrm{TCI}}'
    '\diag': '\operatorname{diag}'
    '\Dir': '\operatorname{Dir}'
    '\dist': '\operatorname{dist}'
    '\Div': '\operatorname{div}'
    '\Dom': '\operatorname{Dom}'
    '\Ent': '\operatorname{Ent}'
    '\F': '\mathcal{F}'
    '\GammaLaw': '\operatorname{Gamma}'
    '\Hess': '\nabla^2'
    '\HS': '\mathrm{HS}'
    '\hstar': 'h^{\star}'
    '\Id': '\mathrm{Id}'
    '\Jsharp': '\calJ^{\sharp}'
    '\KL': '\operatorname{KL}'
    '\Lip': '\operatorname{Lip}'
    '\lmax': '\lambda_{\max}'
    '\lmin': '\lambda_{\min}'
    '\op': '\mathrm{op}'
    '\osc': '\operatorname{osc}'
    '\Per': '\operatorname{Per}'
    '\Proj': '\operatorname{Proj}'
    '\PsiKLS': '\Psi'
    '\Pstar': 'P'
    '\qJac': '\mathsf q'
    '\Sigmaz': '\Sigma_0'
    '\supp': '\operatorname{supp}'
    '\Tr': '\operatorname{Tr}'
    '\Var': '\operatorname{Var}'
    '\Vol': '\operatorname{Vol}'
    '\WH': '\mathsf H'
    '\Wtwo': 'W_2'
  # Each statement shows its status, read from the ledger, and its label, with links to the
  # issue forms of .github/ISSUE_TEMPLATE: see scripts/status.mjs.
  plugins:
    - scripts/status.mjs
  # The manuscript comes first, then the full proofs. A short welcome page, then the
  # introduction; the literature (six families); the proofs of KLS: the first version of
  # Song--Zhang (the spectral criterion that BKL and SZ v2 use), then Bizeul--Klartag--Lehec,
  # the second version of Song--Zhang with its technical estimates in a chapter of their
  # own, Balasubramanian--Kasiviswanathan, and the comparison of the three proofs. Then KLS
  # after its proofs (prose only); the alternative mechanisms, opened by their map
  # (chapter 14) -- the moment map, the fixed eigenfunction, conditional fibers -- in the
  # order of what each has established, the localization prelude (chapter 20) opening the
  # fixed eigenfunction (the fixed-cut archive links back to it); the shared technical
  # foundations; and, last before the proofs, the fixed cut as an archive.
  # Proof chapters are titled "Authors: mechanism" (owner's decision, 2026-10-07).
  # Owner's decisions of 2026-10-06: research/explorations/2026-10-06-editorial-restructure.md.
  #
  # The full proofs: proofs.md, then the dossiers in the groups of proofs.md. A new dossier
  # is added to the brace list of its group here and to proofs.md. Drafts are listed for
  # local reading; the pages workflow removes them before it publishes, so each group's
  # pattern must keep matching at least one file (a pattern that matches nothing is an error).
  toc:
    - file: modules/index.md
    - file: modules/00-overview.md
    - title: "The literature: six families"
      children:
        - file: modules/01-family-needles.md
        - file: modules/02-family-stochastic-localization.md
        - file: modules/03-family-bochner-hminus1.md
        - file: modules/04-family-moment-map.md
        - file: modules/05-family-transport.md
        - file: modules/06-family-parallel-coupling.md
    - title: The proofs of KLS
      children:
        - file: modules/07-polynomial-curvature.md
        - file: modules/08-bkl-cumulants-suspension.md
        - file: modules/09-song-zhang-v2.md
        - file: modules/10-sz-v2-technical.md
        - file: modules/11-bk-compatible-integration.md
        - file: modules/12-proofs-compared.md
    - title: After KLS
      children:
        - file: modules/13-kls-after-proofs.md
    - title: Alternative mechanisms
      children:
        - file: modules/14-alternative-mechanisms.md
        - title: Moment map
          children:
            - file: modules/15-moment-map-cmh.md
            - file: modules/16-cmh-normalization.md
            - file: modules/17-cmh-exact-cases.md
            - file: modules/18-moment-map-construction.md
            - file: modules/19-appendix-moment-map.md
        - title: Fixed eigenfunction
          children:
            - file: modules/20-localization-prelude.md
            - file: modules/21-spectral-approach.md
        - title: Conditional fibers
          children:
            - file: modules/22-conditional-fiber-frame.md
    - title: Shared technical foundations
      children:
        - file: modules/23-notation.md
        - file: modules/24-riccati.md
        - file: modules/25-qcts-obstruction.md
        - file: modules/26-covariance-technology.md
        - file: modules/27-model-geometries.md
        - file: modules/glossary.md
    - title: "Archive: the fixed cut"
      children:
        - file: modules/28-fixed-cut.md
        - file: modules/29-fixed-cut-open-problems.md
        - file: modules/30-carleson-mass-martingale.md
        - file: modules/31-product-stress.md
        - file: modules/32-near-cheeger-stein.md
        - file: modules/33-bootstrap.md
        - file: modules/34-jacobi-splitting.md
    - title: Full proofs
      children:
        - file: proofs.md
        - title: "Song–Zhang, first version"
          children:
            - pattern: 'solutions/{thm-sz-polynomial-variance,thm-sz-curvature-comparison,thm-sz-iterated-curvature,thm-song-zhang-kls,prop-sz-exponential-coefficients-equivalence}.md'
        - title: "Bizeul–Klartag–Lehec"
          children:
            - pattern: 'solutions/{bkl-analytic-foundations,bkl-tilt-criterion,bkl-cumulant-dynamics,bkl-cumulant-energy,bkl-cumulant-bound,bkl-suspension-kls,cor-bkl-uniform-conditional-initialization}.md'
        - title: "Song–Zhang, second version"
          children:
            - pattern: 'solutions/{sz-v2-height-reduction,sz-v2-inner-foundations,sz-v2-inner-refinement,sz-v2-dimension-bound,sz-v2-block-foundations,sz-v2-joint-loss,sz-v2-height-blocks,sz-v2-chain-blocks,sz-v2-small-loss,sz-v2-summable-budgets,sz-v2-kls,sz-v2-kls-composition}.md'
        - title: "Balasubramanian–Kasiviswanathan"
          children:
            - pattern: 'solutions/{lem-bk-regular-approximation,lem-bk-compatible-hodge,prop-bk-integration-calculus,lem-bk-uniform-power-bound,lem-bk-localization-covariance,prop-bk-reverse-transfer,thm-bk-appell-bound,thm-bk-explicit-poincare,bk-kls-composition}.md'
        - title: "Results of the literature"
          children:
            - pattern: 'solutions/{thm-letwin-imports,letwin-covariance-windows,thm-letwin-kls,thm-chen-klartag-imports,thm-kl-rank-imports}.md'
        - title: "The moment map"
          children:
            - pattern: 'solutions/{thm-cmh-normalization,thm-cmh-dirichlet,lem-linear-sector-third-moment,lem-cmh-linear-spectral-resolution,prop-cone-moment-map,prop-product-simplex-cone-gate,prop-cmh-approximation-closure,prop-cmh-recovery-calculus,lem-affine-poincare-w2-liminf}.md'
        - title: "The fixed eigenfunction"
          children:
            - pattern: 'solutions/{prop-spectral-sufficiency,lem-mm-posterior-defect,lem-mm-restart-deweighting,lem-mm-smallgap-fourth-moment,lem-mm-time-weighted-fixed-source,lem-mm-stopped-window-source,prop-mm-window-occupation}.md'
        - title: "Conditional fibers"
          children:
            - pattern: 'solutions/{conditional-fiber-frame-structure,lem-fiber-polynomial-floor,lem-fiber-root-degree-two}.md'
        - title: "Foundations and the fixed-cut archive"
          children:
            - pattern: 'solutions/{kls-localization-riccati-core,cor-full-matrix-dissipation,kls-qcts-stein-boundary-core,letwin-source-consequences,kls-geometry-models,lem-survival-implies-kls,thm-carleson-implies-centroid,thm-centroid-implies-kls,thm-intro-weighted,kls-bootstrap-interface,thm-bootstrap-stopped-interface,cor-dichotomy,lem-time-weighted-source,lem-lyapunov-stein-duality,kls-product-covariance,prop-split-screened-supply,kls-excess-audit,prop-weighted-spectator-obstruction,prop-spectator-excess-rate-obstruction}.md'
site:
  template: book-theme
  options:
    logo_text: The KLS theorem
