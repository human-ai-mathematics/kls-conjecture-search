# The MyST project: the manuscript (modules/) and the full proofs (solutions/).
#
#   npx myst start           # read it locally, live
#   npx myst build --html    # the static site, as pages.yml publishes it
#
# `uv run scripts/check.py` builds the project and reads its AST: every labelled claim
# directive under modules/ is a ledger node with the same id.
version: 1
project:
  title: The Kannan–Lovász–Simonovits Frontier
  github: https://github.com/numina-functional-inequalities/kls-conjecture-search
  subtitle: Approaches toward a dimension-free Poincaré constant for isotropic log-concave measures
  # Text under CC BY 4.0, code under MIT: see LICENSE.
  license:
    content: CC-BY-4.0
    code: MIT
  authors:
    - name:
        literal: Collaboration
  # The shared bibliography. A literature node's `references:` keys must
  # exist here. It ships empty: MyST refuses a .bib holding only comments.
  bibliography:
    - references.bib
  # Macros for every module and dossier. A fixed normalization is a `definition` node,
  # not only a macro.
  math:
    # --- core macros (domain-neutral)
    '\R': '\mathbb{R}'
    '\E': '\mathbb{E}'
    '\Prob': '\mathbb{P}'
    '\one': '\mathbf{1}'
    '\eps': '\varepsilon'
    '\dd': '\,\mathrm{d}'
    '\norm': '\left\lVert #1\right\rVert'
    '\abs': '\left\lvert #1\right\rvert'
    '\inner': '\left\langle #1,#2\right\rangle'
    # --- program macros (from the LaTeX preamble of kls v0.1)
    '\Aop': '\mathsf A'
    '\calB': '\mathcal B'
    '\calD': '\mathcal D'
    '\calE': '\mathcal E'
    '\calI': '\mathcal I'
    '\calJ': '\mathcal J'
    '\calK': '\mathcal K'
    '\calL': '\mathcal L'
    '\calM': '\mathcal M'
    '\calQ': '\mathcal Q'
    '\calR': '\mathcal R'
    '\calS': '\mathcal S'
    '\calT': '\mathcal T'
    '\CLS': 'C_{\mathrm{LS}}'
    '\CMH': 'C_{\mathrm{CMH}}'
    '\Cov': '\operatorname{Cov}'
    '\CP': 'C_{\mathrm P}'
    '\CPaff': 'C_{\mathrm P}^{\mathrm{aff}}'
    '\CTCI': 'C_{\mathrm{TCI}}'
    '\diag': '\operatorname{diag}'
    '\Dir': '\operatorname{Dir}'
    '\dist': '\operatorname{dist}'
    '\Div': '\operatorname{div}'
    '\Dom': '\operatorname{Dom}'
    '\Ent': '\operatorname{Ent}'
    '\F': '\mathcal{F}'
    '\GammaLaw': '\operatorname{Gamma}'
    '\Hess': '\nabla^2'
    '\HS': '\mathrm{HS}'
    '\hstar': 'h^{\star}'
    '\Id': '\mathrm{Id}'
    '\Jsharp': '\calJ^{\sharp}'
    '\KL': '\operatorname{KL}'
    '\Lip': '\operatorname{Lip}'
    '\lmax': '\lambda_{\max}'
    '\lmin': '\lambda_{\min}'
    '\op': '\mathrm{op}'
    '\osc': '\operatorname{osc}'
    '\Per': '\operatorname{Per}'
    '\Proj': '\operatorname{Proj}'
    '\PsiKLS': '\Psi'
    '\Pstar': 'P'
    '\qJac': '\mathsf q'
    '\Sigmaz': '\Sigma_0'
    '\supp': '\operatorname{supp}'
    '\Tr': '\operatorname{Tr}'
    '\Var': '\operatorname{Var}'
    '\Vol': '\operatorname{Vol}'
    '\WH': '\mathsf H'
    '\Wtwo': 'W_2'
  # Each statement shows its status, read from the ledger, and its label, with links to the
  # issue forms of .github/ISSUE_TEMPLATE: see scripts/status.mjs.
  plugins:
    - scripts/status.mjs
  # The manuscript comes first, then the full proofs. A pattern that matches nothing is
  # an error, so the proofs' pattern also matches their introduction page:
  # '{proofs,solutions/*}.md' reads "proofs.md, then every dossier". Drafts are listed
  # here for local reading; the pages workflow removes them before it publishes.
  # A short welcome page, then the introduction; the literature (six families), then the
  # current frontier, which is one recent argument and not a family. The four approaches
  # follow in the order of what each has established -- the moment map, the fixed
  # eigenfunction, conditional fibers, the fixed cut -- not of their research priority,
  # which the atlas states separately. An appendix used by one approach sits inside it,
  # except the fixed cut's technical chapters, which form the last part before the proofs.
  toc:
    - file: modules/index.md
    - file: modules/00-overview.md
    - title: "The literature: six families"
      children:
        - file: modules/01-family-needles.md
        - file: modules/02-family-stochastic-localization.md
        - file: modules/03-family-bochner-hminus1.md
        - file: modules/04-family-moment-map.md
        - file: modules/05-family-transport.md
        - file: modules/06-family-parallel-coupling.md
    - title: The current frontier
      children:
        - file: modules/07-polynomial-curvature.md
    - title: The four approaches
      children:
        - file: modules/08-frontier-atlas.md
        - title: Moment map
          children:
            - file: modules/09-moment-map-cmh.md
            - file: modules/10-cmh-normalization.md
            - file: modules/11-cmh-exact-cases.md
            - file: modules/12-moment-map-construction.md
            - file: modules/13-appendix-moment-map.md
        - file: modules/14-localization-prelude.md
        - title: Fixed eigenfunction
          children:
            - file: modules/15-spectral-approach.md
        - title: Conditional fibers
          children:
            - file: modules/16-conditional-fiber-frame.md
        - title: Fixed cut
          children:
            - file: modules/17-fixed-cut.md
            - file: modules/18-fixed-cut-open-problems.md
    - title: Synthesis and perspectives
      children:
        - file: modules/19-synthesis.md
        - file: modules/glossary.md
    - title: Shared technical foundations
      children:
        - file: modules/20-notation.md
        - file: modules/21-riccati.md
        - file: modules/22-qcts-obstruction.md
        - file: modules/23-covariance-technology.md
        - file: modules/24-model-geometries.md
    - title: "Appendix: the fixed cut in detail"
      children:
        - file: modules/25-carleson.md
        - file: modules/26-product-stress.md
        - file: modules/27-stein-route.md
        - file: modules/28-excess-propagation.md
        - file: modules/29-bootstrap.md
        - file: modules/30-mass-martingale.md
        - file: modules/31-stein-dictionary.md
        - file: modules/32-jacobi-splitting.md
        - file: modules/33-fixed-cut-calculations.md
    - title: Full proofs
      children:
        - pattern: '{proofs,solutions/*}.md'
site:
  template: book-theme
  options:
    logo_text: The KLS Frontier
