# Issues are for things that are actionable. Conversation goes to Discussions.
#
# `blank_issues_enabled: true` on purpose: the five forms cover what the site's buttons
# open, and a contributor with something that fits none of them should not have to
# pretend it does.
#
# The two URLs below are the only place in the repository that hardcodes the
# owner/repo slug: everything the site links derives it from the `origin` remote.
# A fork therefore has to repoint exactly this file, which is README.md's
# instantiation step 5 and docs/PUBLISHING-THE-SITE.md.
#
# A dead link in the one file every contributor is shown is worse than one fewer link,
# so a link lands here only once the thing it points at exists:
#
#   "Ask a question, or think out loud" is live. Discussions is enabled and
#       `gh repo view --json hasDiscussionsEnabled` reports true.
#
#   "Read the search first" stays withdrawn: the site still 404s. Pages is configured
#       (Settings -> Pages -> Build and deployment -> Source: GitHub Actions) but has
#       never deployed, and the page appears once .github/workflows/pages.yml is
#       dispatched from the default branch. docs/PUBLISHING-THE-SITE.md is the full
#       path; publishing is manual because it is expensive and because it is a claim.
#       Note the repository is private, so this is a decision about visibility and not
#       only about readiness.
blank_issues_enabled: true
contact_links:
  - name: Ask a question, or think out loud
    url: https://github.com/numina-functional-inequalities/kls-conjecture-search/discussions
    about: >
      Interpretation, background, why a route was abandoned, whether an idea is worth
      trying. Nothing has to be finished to be worth saying here.

