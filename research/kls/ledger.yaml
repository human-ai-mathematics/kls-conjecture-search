# ledger.yaml — canonical logical state of the KLS proof program (Part III)
# =============================================================================
# SINGLE SOURCE OF TRUTH for what is proved / conditional / open / refuted in the
# KLS program, and for the dependency edges. The LaTeX in modules/kls/ is the
# prose+proof; this file is the machine-readable graph.
#
# This is Part III's route-spanning control plane. It began as the Eldan-localization
# roadmap ledger and was moved to research/kls/ when the deterministic moment-map/CMH
# route became substantial enough to track. Nodes may carry a route field; all edits still
# pass through one orchestrator because this remains a single-file contention point.
#
# DIFFERENT PHASE FROM THE A-SERIES. The A1-A5 ledger (../ledger.yaml, program: ab)
# is in the REFINEMENT phase (sharpen statements; numerics validate/refute via finum).
# KLS is already a PROOF program: the statements are crisp, the work is discharging
# assumptions and proving conditional implications. Hence the richer status/obstruction
# vocabulary below, and the machine-enforced no-go set (obstructions.yaml). Numerics
# (finum.localization) only REFUTE or give direction here — they never make a node "proved".
#
# status:  proved | conditional | open | heuristic | refuted | imported
# imported nodes optionally set import_class: published (default) | preprint-unreviewed;
# the latter must propagate through `assuming` and cannot underlie a proved node.
# kind:    theorem|lemma|proposition|corollary|definition|assumption|hypothesis|
#          question|program|remark|heuristic
# edges:   depends_on (acyclic; may include external free-text or \label refs),
#          assuming (the open node a conditional rests on), unlocks (forward pointers
#          only; never a duplicate of the target's depends_on/assuming), bounded_by
#          (obs:* in obstructions.yaml), discharged_by, entry_point, mechanism +
#          clearance (no-go discipline), bridges (cross-program links: program/id).
#
# Checked by ../check_ledger.py (program-aware): acyclicity, no proved-on-open/refuted,
# obstruction parity (yaml<->md<->bounded_by), mechanism vocabulary, no-go clearance,
# and cross-program bridge resolution.
# =============================================================================

meta:
  program: kls
  conjecture: "KLS: inf_n hstar_n > 0  (dimension-free Cheeger lower bound for isotropic log-concave measures)"
  best_known: "Published: hstar_n >= c (log n)^(-1/2) (Klartag 2023). Conditional on Letwin arXiv:2607.24164v1: hstar_n >= c (log n)^(-1/4), equivalently CP <= C sqrt(log n). Chen-Klartag arXiv:2607.23307v1 proves sharp thin shell but does not itself announce this general KLS improvement."
  routes:
    eldan-localization: "Fixed-cut stochastic localization with Eldan-A (all-cut Carleson) and Eldan-B (weighted excess plus stable Stein trace)."
    moment-map-spectral: "Fixed-eigenfunction stochastic localization; open universal-time tensor/covariance alignment estimate."
    moment-map-cmh: "Deterministic Haar/Schur-Piola program; endpoint normalization, invariant lift, all-split reduction, and global square-root commutator remain open."
  legacy_route_default: "Nodes without an explicit route field belong to route eldan-localization; new shared and non-Eldan nodes must carry route metadata."
  proof_strategy: "The Eldan-B bootstrap argues by contradiction against a near-worst measure (h_mu <= (1+eps) hstar_n). This is route-specific, not the posture of every KLS route."
  bridge: "A1-bis (ab/conj:a1-bis) is the structured-posterior counterpart: C_P <= K lambda_max(Cov) for GLM posteriors. The SAME bound for EVERY isotropic log-concave measure, K universal, IS this conjecture — Part I's 'Tier-infinity' boundary."
  numerics: "finum.localization (finum run --target kls-loc) remains a diagnostic engine. The separate kls-align target implements P6 for one designated isotropic Laplace-product tail union and is non-refuting/directional only; P2 weighted excess, P3 weighted Stein, P4 cut-free taming, universal P6, tilted-state dynamic gates, and all CMH observables remain unimplemented. No route verdict is available."
  certification_debt: "Legacy Eldan nodes predate the current R2 dossier contract: 41 nodes marked proved have inline manuscript arguments but no solution/checked_by metadata. This consolidation does not recertify or promote them; the debt is recorded in the 2026-08-24 independent audit."

# ---------------------------------------------------------------------------
# CORE STOCHASTIC LAYER  (legacy proved backbone; current R2 debt recorded above)
# ---------------------------------------------------------------------------
nodes:

  - id: conj:kls
    kind: conjecture
    status: open
    route: shared
    file: modules/kls/00-strategy-map.tex
    statement: "There is a universal C such that Var_mu(f) <= C int |grad f|^2 dmu for every isotropic log-concave mu in every dimension; equivalently up to universal constants, inf_n hstar_n > 0."
    entry_point: [thm:intro-all-cut, thm:intro-weighted, q:mm-spectral-occupation, prog:cmh-route]
    bridges: [ab/conj:a1-bis]

  - id: lem:survival-implies-kls
    kind: lemma
    status: proved
    file: modules/kls/02-mass-martingale-centroid.tex
    statement: "A positive-probability balanced posterior event at one time gives a quantitative boundary lower bound for the cut; if uniform over balanced cuts at universal constants, it implies KLS."
    depends_on: ["Bakry-Emery/Lichnerowicz", eq:perimeter-supermartingale]

  - id: ass:stopped-centroid
    kind: assumption
    status: open
    file: modules/kls/02-mass-martingale-centroid.tex
    statement: "Stopped centroid estimate: E ∫_0^{T∧τ} |δ_t|^2 dt ≤ CT for balanced cuts."

  - id: thm:centroid-implies-kls
    kind: theorem
    status: conditional
    file: modules/kls/02-mass-martingale-centroid.tex
    statement: "Stopped centroid estimate implies a dimension-free Cheeger lower bound (KLS)."
    depends_on: [eq:qv-p, ass:stopped-centroid, lem:survival-implies-kls]
    assuming: [ass:stopped-centroid]

  - id: lem:matrix-riccati
    kind: lemma
    status: proved
    file: modules/kls/03-riccati-identities.tex
    statement: "Matrix two-color Riccati identity: dB_t = dN_t + (s G^2 - AB - BA + rB) dt; hence dR = dÑ - (R^2 + s G^2) dt."
    depends_on: [eq:cov-sde, eq:CE-minus-pA]

  - id: thm:scalar-riccati
    kind: theorem
    status: proved
    file: modules/kls/03-riccati-identities.tex
    statement: "Scalar Riccati: dr_t = dM_t + (S_t - D_t) dt with S=s||G||^2 the only positive source, D≥r^2 coercive."
    depends_on: [lem:matrix-riccati]

  - id: cor:per-direction
    kind: corollary
    status: proved
    file: modules/kls/03-riccati-identities.tex
    statement: "Unconditional per-direction Carleson: E ∫_0^∞ s|Gθ|^2 ≤ θ^T R_0 θ ≤ 1; i.e. E ∫ s G^2 ⪯ R_0 ⪯ I."
    depends_on: [lem:matrix-riccati]
    note: "Dimension-free at the quadratic-form level only; the trace upgrade is the missing step (q:upgrade)."

  - id: ass:all-cut-carleson
    kind: assumption
    status: open
    file: modules/kls/00-introduction.tex
    statement: "All-cut absorptive two-color Carleson: E ∫_I S_t ≤ C_0|I| + C_1 E ∫_I r_t + α E ∫_I D_t, α<1, every balanced cut."
    bounded_by: [obs:two-tail, obs:relative-ceiling, obs:proj-ceiling]

  - id: thm:carleson-implies-centroid
    kind: theorem
    status: conditional
    file: modules/kls/08-carleson-consumption.tex
    statement: "All-cut Carleson implies the stopped centroid estimate (via Gronwall on E r_{t∧τ}), hence KLS."
    depends_on: [ass:all-cut-carleson, thm:scalar-riccati, eq:qv-p, lem:survival-implies-kls]
    assuming: [ass:all-cut-carleson]

  - id: cor:tight-window-consumption
    kind: corollary
    status: proved
    file: modules/kls/08-carleson-consumption.tex
    statement: "An absorptive Carleson estimate on a fixed tight balance window yields universal balanced survival and hence a universal boundary lower bound for the cut."
    depends_on: [thm:scalar-riccati, eq:qv-p, lem:survival-implies-kls]

  - id: thm:intro-all-cut
    kind: theorem
    status: conditional
    file: modules/kls/00-introduction.tex
    statement: "Assumption all-cut-carleson implies KLS (headline of Eldan-A)."
    depends_on: [thm:carleson-implies-centroid]
    assuming: [ass:all-cut-carleson]
    note: "Bridge: the universal C_P <= K lambda_max(Cov) (every isotropic log-concave measure) IS KLS; ab/conj:a1-bis is its structured GLM counterpart."

  - id: lem:pathwise-BL
    kind: lemma
    status: proved
    file: modules/kls/08-carleson-consumption.tex
    statement: "Pathwise Brascamp–Lieb source bound: s||K||^2 ≤ 4 λmax(A)/t ≤ 4/t^2."
    depends_on: [eq:BL-cap]

  - id: cor:away-from-zero
    kind: corollary
    status: proved
    file: modules/kls/08-carleson-consumption.tex
    statement: "Source is pathwise controlled away from t=0: S_t ≤ 8/t^2 + D_t/2 on the tight window."
    depends_on: [lem:pathwise-BL]
    note: "Shows the Carleson difficulty is purely small-time and probabilistic."

  # ---------------------------------------------------------------------------
  # ROUTE-AGNOSTIC JULY 2026 MOMENT-MAP INPUTS
  # ---------------------------------------------------------------------------
  - id: thm:chen-klartag-moment-hessian
    kind: theorem
    status: imported
    import_class: preprint-unreviewed
    route: shared
    file: modules/kls/00-strategy-map.tex
    statement: "Chen-Klartag moment-Hessian estimate: for the regular moment map of an isotropic log-concave measure, E_nu ||D^2 phi||_HS^2 <= 2n."
    note: "Imported from arXiv:2607.23307v1, Theorem 1.5 (25 July 2026); approximation yields the stated general consequences in that paper."

  - id: thm:chen-klartag-thin-shell
    kind: theorem
    status: imported
    import_class: preprint-unreviewed
    route: shared
    file: modules/kls/00-strategy-map.tex
    statement: "Chen-Klartag sharp thin shell: Var(|X|^2) <= 8n for isotropic log-concave X, with equality for products of standard centered one-sided exponentials."
    depends_on: [thm:chen-klartag-moment-hessian]
    note: "Imported from arXiv:2607.23307v1, Theorem 1.1. This radial result does not by itself prove full KLS."

  - id: thm:chen-klartag-third-moment
    kind: theorem
    status: imported
    import_class: preprint-unreviewed
    route: shared
    file: modules/kls/00-strategy-map.tex
    statement: "Chen-Klartag sharp full third-moment tensor: ||T_3(X)||_HS^2 <= 4n for isotropic log-concave X."
    depends_on: [thm:chen-klartag-moment-hessian]
    note: "Imported from arXiv:2607.23307v1, Theorem 1.2. Letwin's quadratic Poincare theorem alone gives only a weaker full-tensor consequence; the sharp 4n uses further Chen-Klartag identities."

  - id: thm:letwin-moment-map
    kind: theorem
    status: imported
    import_class: preprint-unreviewed
    route: shared
    file: modules/kls/00-strategy-map.tex
    statement: "Under Letwin's regular moment-map assumptions, for every constant symmetric B, E_nu tr(B H B H) <= 2 tr(B^2)."
    note: "Imported from arXiv:2607.24164v1, Theorem 2.5 (27 July 2026). Taking B=I contains the shared Chen-Klartag moment-Hessian direction but not their full sharp result set."

  # ---------------------------------------------------------------------------
  # STATIC OBSTRUCTION LAYER (quadratic chaos / thin shell)
  # ---------------------------------------------------------------------------
  - id: def:qcts
    kind: definition
    status: proved
    file: modules/kls/05-obstruction.tex
    statement: "Quadratic-chaos thin shell Q(ν)=sup_{||M||=1} Var(X^T M X)."

  - id: thm:letwin-qcts
    kind: theorem
    status: imported
    import_class: preprint-unreviewed
    file: modules/kls/05-obstruction.tex
    statement: "Letwin quadratic Poincare inequality: for isotropic log-concave X and symmetric M, Var(X^T M X) <= 8 ||M||_HS^2."
    note: "Imported as a black-box theorem from arXiv:2607.24164v1, Theorem 1.2 (27 July 2026). Its proof uses the matrix moment-map estimate recorded separately as thm:letwin-moment-map; that internal paper dependency is not a second repository assumption. Version-1 preprint, not peer reviewed; downstream improvements retain this caveat."

  - id: cor:qcts-source
    kind: corollary
    status: conditional
    file: modules/kls/05-obstruction.tex
    statement: "Whitened two-color control: s||A^(-1/2) K A^(-1/2)||_HS^2 <= 8; hence s||K||_HS^2 <= 8 lambda_max(A)^2 and, on p in [1/3,2/3], S <= 17 lambda_max(A)^2 (8 at balance)."
    depends_on: [thm:letwin-qcts, prop:stein-rep]
    assuming: [thm:letwin-qcts]

  - id: prop:qcts-equivalence
    kind: proposition
    status: proved
    file: modules/kls/05-obstruction.tex
    statement: "Time-zero: QCTS ⇔ balanced two-color bound pq||Σ_E-Σ_F||^2 ≤ C (Carbery–Wright)."
    depends_on: [def:qcts]
    bounded_by: [obs:proj-ceiling]

  # ---------------------------------------------------------------------------
  # STEIN-TRACE LAYER (Eldan-B currency)
  # ---------------------------------------------------------------------------
  - id: prop:stein-rep
    kind: proposition
    status: proved
    file: modules/kls/04-stein-dictionary.tex
    statement: "Two-color Stein representation: ∫_E f_M dν = s⟨K,M⟩; Stein norm S_ν(E)=s^2||K||^2 = same object as Riccati source."
    unlocks: [thm:covariance-bound]

  - id: lem:stein-vs-source
    kind: lemma
    status: proved
    file: modules/kls/04-stein-dictionary.tex
    statement: "On the tight window, S_t and S_{μt}(E)/s_t are equivalent up to 64η^2 D_t (lossless conversion)."
    depends_on: [prop:stein-rep, thm:scalar-riccati]

  - id: lem:boundary-rep
    kind: lemma
    status: proved
    file: modules/kls/10-stein-route.tex
    statement: "Boundary representation for the centered Neumann Poisson problem on a smooth bounded convex support: Cov(1_E,f) = -∫_Σ ∂_n u_f dσ; support-boundary flux vanishes and trace Cauchy–Schwarz follows."

  - id: ass:weighted-package
    kind: assumption
    status: open
    file: modules/kls/00-introduction.tex
    statement: "Weighted near-Cheeger package: (i-w) weighted excess propagation + (ii-w) weighted stable Stein-trace estimate on one fixed tight window eta, with 0<=beta<1/2 and the explicit absorption margin 2 beta + 64 eta^2 < 1."
    bounded_by: [obs:two-tail]

  - id: thm:intro-weighted
    kind: theorem
    status: conditional
    file: modules/kls/00-introduction.tex
    statement: "Weighted geometric package implies KLS (headline of Eldan-B)."
    depends_on: [ass:weighted-package, lem:stein-vs-source, cor:tight-window-consumption]
    assuming: [ass:weighted-package]

  - id: prop:intro-audit
    kind: proposition
    status: proved
    file: modules/kls/00-introduction.tex
    statement: "Consumption audit: unweighted excess term is inert; unweighted Stein-trace estimate alone would imply KLS but admits no slice-wise proof."
    depends_on: [prop:trivial-excess, prop:two-tail]

