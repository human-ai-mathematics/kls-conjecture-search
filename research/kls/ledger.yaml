    file: modules/kls/24-excess-propagation.tex
    statement: "For every fixed Borel cut E with finite initial lower outer Minkowski perimeter, the process mu_t^+(E) is an integrable nonnegative supermartingale. If the initial density is smooth and compactly supported and E has C2 boundary with a tubular neighborhood over that support, the same lower Minkowski perimeter is a true martingale with the displayed driftless weighted-surface SDE."
