  # ---------------------------------------------------------------------------
  # DETERMINISTIC MOMENT-MAP / CMH ROUTE - NORMALIZATION LAYER (2026-08-25)
  #
  # Logically prior to the Haar/commutator construction layer above, and sharing
  # almost none of its machinery. Manuscript: modules/kls/41-cmh-normalization.tex
  # and modules/kls/42-cmh-exact-cases.tex. Exploration:
  # research/explorations/2026-08-25-kls-cmh-normalization-layer.md.
  #
  # SCOPE: nothing here proves KLS, and nothing here supports universal CMH(4).
  # rem:cmh-stronger-than-kls records the extra nonnegative solenoidal channel;
  # no separating measure or strict non-implication from KLS is known.
  # The CMH route therefore stays open.
  # ---------------------------------------------------------------------------
  - id: def:cmh
    kind: definition
    status: defined
    route: moment-map-cmh
    file: modules/kls/41-cmh-normalization.tex
    statement: "The canonical moment-Hessian constant C_CMH(mu) is the supremum over g in Dom(A) minus ker(A) of E<H grad g, Sigma^{-1} H grad g> divided by E(L_mu g)^2, where L_mu g = div_mu(H grad g) = Tr(H D^2 g) - p.grad g is the Stein generator, A = -L_mu, the space is L^2(mu), and every inverse is the pseudoinverse on the orthogonal complement of ker A; Sigma^{-1} is the Moore-Penrose inverse on the affine tangent space for measures on a proper affine subspace."

  - id: prop:cmh-bochner
    kind: proposition
    status: proved
    route: moment-map-cmh
    file: modules/kls/41-cmh-normalization.tex
    statement: "Integrated Bochner identity for the Stein generator: E(L_mu g)^2 = E[<H grad g, grad g> + Tr(H D^2 g H D^2 g)]."
    depends_on: [def:cmh]
    solution: solutions/thm-cmh-normalization.tex
    checked_by: agent
    review: research/reviews/2026-08-25-kls-cmh-normalization-repair-audit.md

  - id: thm:cmh-implies-affine-poincare
    kind: theorem
    status: proved
    route: moment-map-cmh
    file: modules/kls/41-cmh-normalization.tex
    statement: "CP_aff(mu) <= C_CMH(mu) for every centered log-concave mu in the regular moment-map class. Hence a universal bound C_CMH <= 4 would prove conj:kls with affine Poincare constant 4."
    depends_on: [def:cmh]
    solution: solutions/thm-cmh-normalization.tex
    checked_by: agent
    review: research/reviews/2026-08-25-kls-cmh-normalization-repair-audit.md

  - id: prop:cmh-hodge
    kind: proposition
    status: proved
    route: moment-map-cmh
    file: modules/kls/41-cmh-normalization.tex
    statement: "Weighted Hodge identity: with u = H grad g, h = -div_mu u and psi solving -div_mu(Sigma grad psi) = h, the fields Sigma grad psi and w = u - Sigma grad psi are orthogonal in L^2(mu;Sigma^{-1}) and E<u,Sigma^{-1}u> = E<Sigma grad psi, grad psi> + E<w,Sigma^{-1}w>; the operator norm of the first term as a function of h is exactly CP_aff(mu)."
    depends_on: [def:cmh]
    solution: solutions/thm-cmh-normalization.tex
    checked_by: agent
    review: research/reviews/2026-08-25-kls-cmh-normalization-repair-audit.md

