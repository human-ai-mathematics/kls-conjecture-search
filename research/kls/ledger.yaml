  - id: def:cmh
    kind: definition
    status: defined
    route: moment-map-cmh
    file: modules/kls/41-cmh-normalization.tex
    statement: "The canonical moment-Hessian constant C_CMH(mu) is the supremum over g in Dom(A) minus ker(A) of E<H grad g, Sigma^{-1} H grad g> divided by E(L_mu g)^2, where L_mu g = div_mu(H grad g) = Tr(H D^2 g) - p.grad g is the Stein generator, A = -L_mu, the space is L^2(mu), and every inverse is the pseudoinverse on the orthogonal complement of ker A; Sigma^{-1} is the Moore-Penrose inverse on the affine tangent space for measures on a proper affine subspace."

  - id: prop:cmh-bochner
    kind: proposition
    status: proved
    route: moment-map-cmh
    file: modules/kls/41-cmh-normalization.tex
    statement: "Integrated Bochner identity for the Stein generator: E(L_mu g)^2 = E[<H grad g, grad g> + Tr(H D^2 g H D^2 g)]."
    depends_on: [def:cmh]
    solution: solutions/thm-cmh-normalization.tex
    checked_by: agent
    review: research/reviews/2026-08-25-kls-cmh-normalization-repair-audit.md

  - id: thm:cmh-implies-affine-poincare
    kind: theorem
    status: proved
    route: moment-map-cmh
    file: modules/kls/41-cmh-normalization.tex
    statement: "CP_aff(mu) <= C_CMH(mu) for every centered log-concave mu in the regular moment-map class. Hence a universal bound C_CMH <= 4 would prove conj:kls with affine Poincare constant 4."
    depends_on: [def:cmh]
    solution: solutions/thm-cmh-normalization.tex
    checked_by: agent
    review: research/reviews/2026-08-25-kls-cmh-normalization-repair-audit.md

  - id: prop:cmh-hodge
    kind: proposition
    status: proved
    route: moment-map-cmh
    file: modules/kls/41-cmh-normalization.tex
    statement: "Let A1=-div_mu(Sigma grad) be the closed covariance generator and L2_0=(ker A1)^perp. For g in Dom(A) with u=H grad g in L2(mu;Sigma^(-1)), set h=A g=-div_mu u in L2_0, psi=A1^(-1)h with A1^(-1):L2_0 -> Dom(A1) intersect L2_0, and w=u-Sigma grad psi. Then Sigma grad psi and w are orthogonal in L2(mu;Sigma^(-1)), the corresponding energies add exactly, and the supremum of <h,A1^(-1)h>/||h||_2^2 over nonzero h in L2_0 is CP_aff(mu)."
    depends_on: [def:cmh]
    solution: solutions/thm-cmh-normalization.tex
    checked_by: agent
    review: research/reviews/2026-08-27-prop-cmh-hodge-domain-repair-proof-review.md

  - id: rem:cmh-stronger-than-kls
    kind: corollary
    status: proved
    route: moment-map-cmh
    file: modules/kls/41-cmh-normalization.tex
    statement: "The Hodge identity gives C_CMH(mu) >= CP_aff(mu) and identifies the difference as a nonnegative solenoidal channel, which vanishes identically in dimension one under the no-flux convention."
    depends_on: [prop:cmh-hodge, thm:cmh-1d]
    solution: solutions/thm-cmh-normalization.tex
    checked_by: agent
    review: research/reviews/2026-08-27-prop-cmh-hodge-domain-repair-proof-review.md

  - id: conj:gate-zero
    kind: conjecture
