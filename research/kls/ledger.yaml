    statement: "Angular coefficient: for A >= 3, a >= 1, 0 < p <= 1 and z = (A-1)(A-2), the function F_A(a,p) = a/p + 2a(A-2)/(a+1) + z a(a+p)/(a+1)^2 - z/4 satisfies F_A >= A - 1/2 + s_A, where s_A = (z-2)/4 for z <= 4 and sqrt(z) - 3/2 for z >= 4; and s_A >= 0."
