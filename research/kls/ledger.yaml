  # EXCESS PROPAGATION (audit, obstruction, circularity)
  # ---------------------------------------------------------------------------
  - id: prop:trivial-excess
    kind: proposition
    status: proved
    file: modules/kls/11-excess-propagation.tex
    statement: "Unconditional integrated excess bound: E ∫_0^{T∧τ} e_t ≤ (1+e_0) T."
    depends_on: [eq:perimeter-supermartingale, "isotropic halfspace perimeter upper bound"]

  - id: prop:two-tail
    kind: proposition
    status: proved
    file: modules/kls/05-obstruction.tex
    statement: "Quantified anisotropic two-tail config: S/s ≍ Λ^2 while e ≍ Λ^{-1/2}, r=D=0. Kills any slice-wise absolute-scale Stein estimate; calibrates weight (1+||A||)^{5/2}."
    unlocks: [obs:two-tail]

  - id: lem:perimeter-martingale
    kind: lemma
    status: proved
    file: modules/kls/11-excess-propagation.tex
    statement: "Perimeter of a fixed cut is a martingale under localization (driftless); supermartingale without compact support."

  - id: lem:excess-identity
    kind: lemma
    status: proved
    file: modules/kls/11-excess-propagation.tex
    statement: "Exact excess identity: E e_t = e_0 + [I_μ(p_0) - E I_{μt}(p_t)]. Excess propagation = drop of the localized profile."
    depends_on: [lem:perimeter-martingale]

  - id: lem:inf-martingales
    kind: lemma
    status: proved
    file: modules/kls/11-excess-propagation.tex
    statement: "The infimum over a FIXED competitor family of perimeter martingales is a supermartingale. The balanced-mass competitor family is random/time-dependent, so this does not prove that the localized profile is a supermartingale."
    depends_on: [lem:perimeter-martingale]

  # ---------------------------------------------------------------------------
  # BOOTSTRAP COMPARISON + INTERFACE FUNCTIONAL
  # ---------------------------------------------------------------------------
  - id: lem:half
    kind: lemma
    status: proved
    file: modules/kls/12-bootstrap.tex
    statement: "Balance pins the Cheeger ratio: h_ν = 2 I_ν(1/2); at p=1/2 Cheeger excess = profile excess."

  - id: lem:whitening
    kind: lemma
    status: proved
    file: modules/kls/12-bootstrap.tex
    statement: "Whitening comparison: h_ν ≥ hstar_n / λmax(A_ν)^{1/2}; hstar_n nonincreasing in n."

  - id: thm:bootstrap
    kind: theorem
    status: proved
    file: modules/kls/12-bootstrap.tex
    statement: "Bootstrap comparison: for near-worst μ and ANY balanced cut, E[ē_t 1_{t<τη}] ≤ e_0 + h_μ(ε/2+η+P(τ≤t)/2+E X_t/4); compresses propagation into h_μ Ξ_T."
    depends_on: [lem:half, lem:whitening, lem:perimeter-martingale, eq:qv-p]
    mechanism: [direct-excess]
    bounded_by: [obs:circularity]
    clearance: "Excess propagation is anchored at the external worst-case floor hstar_n (proof by contradiction against a near-worst measure), rather than assuming a lower bound for the random localized profile."
    note: "The circularity entry is a methodological warning, not a formal no-go: the moving balanced-mass competitor family is not covered by the fixed-family supermartingale lemma."

  - id: lem:crude
    kind: lemma
    status: proved
    file: modules/kls/12-bootstrap.tex
    statement: "For every isotropic log-concave mu and 1/n <= T <= 1, the crude evaluation gives Xi_T(mu) <= 1 + log(nT)."
    depends_on: [eq:BL-cap, eq:cov-sde]
    mechanism: [crude-bootstrap]
    bounded_by: [obs:crude-insufficient]
    clearance: "States the crude bound precisely in order to DEMONSTRATE its insufficiency (rem:insufficiency): it is never used as a KLS route, only as the lower fence the interface evaluation must beat (cor:loglog gives loglog n)."

  - id: hyp:KI
    kind: hypothesis
    status: imported
    file: modules/kls/06-covariance-technology.tex
    statement: "Known small-time operator-norm control: E||A_t||_op ≤ C_1 for t ≤ c_0(log n)^{-C_2}. (Chen / Klartag–Lehec.)"
    discharged_by: [cor:KI-discharged]
    note: "Discharged in module 06 via thm:KL-window; tail form VERIFIED (2026-06-14 sweep) = KLnotes Thm 61, moments = KlartagLehec2022Polylog Cor 5.4. Verification flag removed."

  - id: cor:loglog
    kind: corollary
    status: proved
    file: modules/kls/12-bootstrap.tex
    statement: "Under hyp:KI and t_1(n) <= T <= 1, Xi_T <= C_1 t_1(n) + log(T/t_1(n)) <= C(1+loglog n); if also T<1/8 and eps<=T^(1/3), this gives supply T e_0 + C h_mu(T^(4/3)+1+loglog n)."
    depends_on: [thm:bootstrap, hyp:KI, cor:KI-discharged]

  - id: prop:ceiling
    kind: proposition
    status: proved
    file: modules/kls/12-bootstrap.tex
    statement: "Relative-scale ceiling: if 9(1+κ)T0<=1/2 and Ξ_T0<=κT0 for ALL isotropic log-concave measures, then KLS follows directly. This is a sufficient KLS-strength condition, not a proved equivalence."
    depends_on: [eq:qv-p, lem:survival-implies-kls]
    unlocks: [obs:relative-ceiling]

