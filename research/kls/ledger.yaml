    note: "The cross-term identity E[(L_i g)(L_j g)] = E[tau_i tau_j (d_ij g)^2] >= 0 for i != j is what makes the sum of conditional estimates admissible. WARNING: this is where the constant is ATTAINED - products of one-sided exponentials give C_CMH = 4 exactly, with zero slack. See rem:cmh-saturation-risk."

