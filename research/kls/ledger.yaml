  - id: prop:letwin-not-gate-zero
    kind: proposition
    status: proved
    route: moment-map-cmh
    file: modules/kls/41-cmh-normalization.tex
    statement: "For every m at least 18 there is a random PSD (m+1)x(m+1) matrix H with E H = Id satisfying E Tr(BHBH) <= 2 Tr(B^2) for EVERY symmetric B, yet lambda_max(E H^2) >= 1 + m/sqrt(2m-1) > 4. Hence positivity, normalization and the constant-matrix estimate do not imply gate zero by matrix algebra; the entire gap is the static commutator, Tr(B^2 H^2) = Tr(BHBH) + (1/2)||[B,H]||_HS^2."
    solution: solutions/thm-cmh-normalization.tex
    checked_by: agent
    review: research/reviews/2026-08-25-kls-cmh-normalization-repair-audit.md

