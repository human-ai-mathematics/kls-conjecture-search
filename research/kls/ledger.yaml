  - id: prop:letwin-not-gate-zero
    kind: proposition
    status: proved
    route: moment-map-cmh
    file: modules/kls/41-cmh-normalization.tex
    statement: "For every m at least 18 there is a random PSD (m+1)x(m+1) matrix H with E H = Id satisfying E Tr(BHBH) <= 2 Tr(B^2) for EVERY symmetric B, yet lambda_max(E H^2) >= 1 + m/sqrt(2m-1) > 4. Hence positivity, normalization and the constant-matrix estimate do not imply gate zero by matrix algebra; the entire gap is the static commutator, Tr(B^2 H^2) = Tr(BHBH) + (1/2)||[B,H]||_HS^2."
    related: [thm:letwin-moment-map, conj:gate-zero, q:mm-square-root-commutator]
    solution: solutions/thm-cmh-normalization.tex
    checked_by: agent
    authored_by: /root/kls_proof_audit
    reviewed_by: /root/kls_evidence_audit
    review: research/reviews/2026-08-25-kls-cmh-normalization-repair-audit.md
    note: "UNCONDITIONAL: the statement is a pure existence claim about matrix laws and does NOT rest on the Letwin preprint being correct, only on the form of its inequality. SCOPE: these matrices are not claimed to be moment-map Hessians - no Monge-Ampere or Codazzi compatibility is imposed - so this does NOT refute conj:gate-zero. It is a fence: any proof of gate zero must consume differential moment-map structure, and the commutator may not be treated as a lower-order correction. The independent proof review verified the three-sector decomposition and perfect-square scalar deficit exactly."

