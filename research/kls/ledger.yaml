    depends_on: [thm:chen-klartag-moment-hessian]

  - id: thm:letwin-moment-map
    kind: theorem
    status: imported
    import_class: preprint-unreviewed
    references: [Letwin2026QuadraticKLS]
    route: shared
    file: modules/kls/04-family-moment-map.tex
    statement: "Under Letwin's regular moment-map assumptions, for every constant symmetric B, E_nu tr(B H B H) <= 2 tr(B^2)."

  - id: thm:kl-stopped-rank-tail
    kind: theorem
    status: imported
    import_class: preprint-unreviewed
    references: [KlartagLehec2025ThinShell]
    route: shared
    file: modules/kls/15-covariance-technology.tex
    statement: "For simplified stochastic localization of an isotropic compactly supported log-concave law, every stopping time sigma and t>0 satisfy sum_i P(lambda_i(A_{t wedge sigma})>=3) <= C n exp(-t^(-1/8)); consequently the rank-k entrance time sigma_k obeys P(sigma_k<=t)<=C(n/k)exp(-t^(-1/8)) and E sigma_k^(-2)<=C(1+log(n/k))^16."

  - id: thm:kl-integrated-rank-covariance
    kind: theorem
    status: imported
    import_class: preprint-unreviewed
    references: [KlartagLehec2025ThinShell]
    route: shared
    file: modules/kls/15-covariance-technology.tex
    statement: "For simplified stochastic localization of an isotropic compactly supported log-concave law, E sum_i exp(2 int_0^1 lambda_i(A_t) dt) <= C n."

  - id: prop:covariance-spike
    kind: proposition
    status: imported
    import_class: published
    references: [KLnotes]
    route: shared
    file: modules/kls/00-orientation.tex
    statement: "For n independent centered rate-one exponentials and independent standard Gaussian G, P(||Cov(X|X+sqrt(s)G)||_op >= c_sp s) >= 1-(1-exp(-s)/2)^n. Hence for s<=log n the event has universal positive probability and the expected operator norm is at least c s."

  - id: lem:one-dimensional-density-variance
    kind: lemma
    status: imported
    import_class: published
    references: [BobkovChistyakov2015Concentration]
    route: shared
    file: modules/kls/27-eldan-open-targets.tex
    statement: "For every one-dimensional log-concave probability density f of variance v>0, 1/12 <= v ||f||_infty^2 <= 1; consequently every quantile halfline has boundary density at most v^(-1/2)."

