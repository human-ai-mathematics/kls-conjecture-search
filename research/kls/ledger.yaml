  - id: lem:lyapunov-stein-duality
    kind: lemma
    status: proved
    route: eldan-localization
    file: modules/kls/21-carleson.tex
    statement: "For t>0, on the covariance support H_t=Ran(A_t), let L_A(M)=(AM+MA)/2 and interpret L_A^(-1) as the inverse on Sym(Ran(A)), extended by zero. Then s<K,L_A^(-1)K> <= 4/t. For K != 0 set lambda_cut(A,K)=||K||_HS^2/<K,L_A^(-1)K>, and set lambda_cut(A,0)=0; hence s||K||_HS^2 <= 4 lambda_cut(A,K)/t. If A,B are positive semidefinite and K is supported on Ran(A), then lambda_cut(A⊕B,K⊕0)=lambda_cut(A,K)."
    depends_on: [lem:pathwise-BL, prop:two-tail]
    solution: solutions/lem-lyapunov-stein-duality.tex
    checked_by: agent
    review: research/reviews/2026-08-27-lem-lyapunov-stein-duality-repair-proof-review.md

