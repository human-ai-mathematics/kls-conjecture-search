  - id: q:cmh-solenoidal-perturbation
    kind: question
    status: open
    route: moment-map-cmh
    file: modules/kls/42-cmh-exact-cases.tex
    statement: "Perturb the saturating product moment potential psi_0(s,t) = phi(s) + t^2/2, with phi the one-sided exponential potential, by eps a(s) b(t) inside the smooth strictly convex class; compute the second variation of C_CMH at eps = 0, split through prop:cmh-hodge. Either exhibit an admissible perturbation with strictly positive second variation, refuting CMH(4), or identify why the solenoidal part vanishes to second order at a saturating product."
    depends_on: [rem:cmh-saturation-risk]
    related: [prog:cmh-route, conj:gate-zero]
    note: "Task M9 and the route's sharpest probe: both ingredients are already exact theorems, so it needs no Haar tree, no invariant lift, and no operator domains beyond def:cmh. The delicate part is certifying isotropy to second order - the first covariance variation must vanish so that whitening is I + O(eps^2). A numerical second variation is directional only and must go through finum. A positive numerical answer identifies a candidate CMH(4) refutation but changes no logical status; an independently checked exact or analytic argument would still say NOTHING about conj:kls."

