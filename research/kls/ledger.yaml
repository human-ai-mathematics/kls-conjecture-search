  - id: lem:conditional-fiber-form
    kind: lemma
    status: proved
    route: conditional-fiber-frame
    file: modules/kls/45-conditional-fiber-frame.tex
    statement: "For a full-dimensional probability with density and finite second moment, the inverse-conditional-variance line-resampling form is a densely defined closed reversible Dirichlet form with its generator understood in form sense, and pointwise on the stated sufficient Bochner domain. If mu is log-concave, every admissible tight frame satisfies D_(mu,rho)(f) <= 4 int |grad f|^2 dmu, so a frame gap C implies CP(mu) <= 4C. Every linear test f_a(x)=a dot x has D_(mu,rho)(f_a)=|a|^2, hence quotient one under isotropy; every admissible Gaussian frame and the coordinate frame on standardized products have form gap one."
    depends_on: [thm:cmh-1d]
    solution: solutions/conditional-fiber-frame-structure.tex
    checked_by: agent
    review: research/reviews/2026-08-27-conditional-fiber-frame-structure-proof-review.md

  - id: q:conditional-fiber-frame
    kind: question
    status: open
    route: conditional-fiber-frame
    file: modules/kls/45-conditional-fiber-frame.tex
    statement: "For every full-dimensional isotropic log-concave mu on R^d, there exists one even test-function-independent probability rho_mu on S^(d-1) with d int theta theta^T d rho_mu = I such that Var_mu(f) <= C D_(mu,rho_mu)(f) for all f in the maximal closed conditional-fiber form domain, with C universal."

  - id: prop:conditional-fiber-root-obstruction
    kind: proposition
    status: proved
    route: conditional-fiber-frame
    file: modules/kls/45-conditional-fiber-frame.tex
    statement: "For the isotropic uniform (m-1)-simplex and the even A_(m-1) root frame, a vertex-cap indicator has normalized conditional-fiber Rayleigh quotient at most 12(m-1)/[(m+1)(m-epsilon)^2(1-(epsilon/m)^(m-1))]; hence the root-frame gap is O(m^(-2))."
    solution: solutions/conditional-fiber-frame-structure.tex
    checked_by: agent
    review: research/reviews/2026-08-27-conditional-fiber-frame-structure-proof-review.md

  - id: prop:sasada-negative-exchange
    kind: proposition
    status: imported
    route: conditional-fiber-frame
    file: modules/kls/45-conditional-fiber-frame.tex
    statement: "For every symmetric-Dirichlet shape a>0, every negative pair-rate exponent s<0, and every m>=2, the complete-graph heat-bath form with pair rate (eta_i+eta_j)^s has spectral gap at most 2^(-s)m^s in the exchange normalization. In particular, for the flat simplex and s=-2, the A_(m-1) root conditional-fiber form has gap at most 48/[m(m+1)]."
    import_class: published
    references: [Sasada2015EnergyExchange]
