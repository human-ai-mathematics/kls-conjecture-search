  # GEOMETRY: second variation, Reilly, splitting (model statements; quant. open)
  # ---------------------------------------------------------------------------
  - id: prop:second-variation
    kind: proposition
    status: proved
    file: modules/kls/13-jacobi-splitting.tex
    statement: "Second variation / nonnegative index form for smooth critical local minimizers; it does not automatically apply to localized fixed near-minimizers and is not coercive modulo Jacobi zero modes."

  - id: lem:profile-bound
    kind: lemma
    status: proved
    file: modules/kls/13-jacobi-splitting.tex
    statement: "If volume p admits a smooth volume-constrained minimizer Sigma_p and I is twice differentiable at p, then the profile bound is K_{Sigma_p} <= -I''(p) I(p)^2."

  - id: cor:generic-degeneracy
    kind: corollary
    status: proved
    file: modules/kls/13-jacobi-splitting.tex
    statement: "Grant smooth minimizers at almost every balanced volume. If h_nu <= 1, then int_{1/3}^{2/3} K_{Sigma_p} dp <= C h_nu^3; this is an averaged branch statement, not control of the tracked cut."
    depends_on: [lem:profile-bound]
    note: "Assumes existence/regularity of volume-constrained minimizers at a.e. balanced volume."

  - id: prop:reilly
    kind: proposition
    status: proved
    file: modules/kls/13-jacobi-splitting.tex
    statement: "Generalized weighted Reilly identity; converts boundary trace data into interior Dirichlet energy up to curvature boundary terms."

  - id: prop:exact-splitting
    kind: proposition
    status: proved
    file: modules/kls/13-jacobi-splitting.tex
    statement: "Two one-way model implications: global cylinder plus globally Hessian-flat direction => log-affine product; an already split log-affine factor's orthogonal halfspace has 𝔎_Σ=0. No converse from 𝔎_Σ=0 is proved."

  - id: rem:almost-stability-gap
    kind: remark
    status: proved
    file: modules/kls/13-jacobi-splitting.tex
    statement: "Foundational gap for the Jacobi route: prove a localization-uniform almost-stability trace theorem for the fixed near-Cheeger cut, modulo constants and geometric Jacobi zero modes, and control the Reilly boundary terms."
    depends_on: [prop:second-variation, prop:reilly, lem:boundary-rep]

  - id: prop:persistent-splitting
    kind: proposition
    status: proved
    file: modules/kls/13-jacobi-splitting.tex
    statement: "Splitting persists under localization: split direction preserved pathwise; A_t block-diagonal; halfspace cuts have rank-one K_t."

