  - id: thm:regular-moment-map-compact-target
    kind: theorem
    status: imported
    import_class: published
    references: [BermanBerndtsson2013RealMA, Fathi2019SteinMomentMaps]
    route: shared
    file: modules/kls/04-family-moment-map.tex
    statement: "If P is a convex body and μ(dx)=g(x)1_int(P)(x)dx is a centered probability with positive smooth g, then its canonical moment potential is smooth and strictly convex, its gradient is a diffeomorphism from R^n onto int(P), and the target-coordinate Hessian is a smooth positive symmetric Stein kernel satisfying Div_μ H=-x and E_μ H=Cov(μ)."

  - id: thm:chen-klartag-moment-hessian
