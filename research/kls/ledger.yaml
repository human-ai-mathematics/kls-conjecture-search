# ledger.yaml — canonical logical state of the KLS proof program (Part III)
# =============================================================================
# SINGLE SOURCE OF TRUTH for what is proved / conditional / open / refuted in the
# KLS program, and for the dependency edges. The LaTeX in modules/kls/ is the
# prose+proof; this file is the machine-readable graph.
#
# This is Part III's route-spanning control plane. It began as the Eldan-localization
# roadmap ledger and was moved to research/kls/ when the deterministic moment-map/CMH
# route became substantial enough to track. Every node carries an explicit route field; all edits still
# pass through one orchestrator because this remains a single-file contention point.
#
# DIFFERENT PHASE FROM THE A-SERIES. The A1-A5 ledger (../a-series/ledger.yaml, program: ab)
# is in the REFINEMENT phase (sharpen statements; numerics stress and suggest refutations via finum).
# KLS is already a PROOF program: the statements are crisp, the work is discharging
# assumptions and proving conditional implications. The programs nevertheless share one status
# vocabulary; KLS additionally has a route-specific fence registry in obstructions.md. Numerics
# (`finum`) give research direction or suggest refutations here; they never validate a claim or
# proof and never make a node "proved".
#
# Shared schema: research/ledger-schema.md
# Program workflow and route ownership: research/kls/README.md
#
# Checked by ../check_ledger.py (program-aware): acyclicity, no proved-on-open/refuted,
# obstruction-id resolution, certification provenance, and cross-program bridges.
# =============================================================================

meta:
  program: kls
  route_policy:
    allowed: [shared, eldan-localization, moment-map-spectral, moment-map-cmh]

# ---------------------------------------------------------------------------
# CORE STOCHASTIC LAYER  (certified standalone dossiers attached to every proved node)
# ---------------------------------------------------------------------------
nodes:

