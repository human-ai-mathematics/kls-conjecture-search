  - id: thm:V2-window
    kind: theorem
    status: conditional
    file: modules/kls/09-product-stress.tex
    statement: "Conditional on Letwin v1, (V2) and the all-cut inequality hold for every measure on [0,c/log n]. Published covariance control gives (V2) for every measure on [0,c/log^2 n], but its preprint-independent all-cut consequence here is only for products. Neither window proves the universal-time assumption."
    depends_on: [cor:letwin-window, thm:KL-window, cor:V2-implies, eq:BL-cap]
    assuming: [thm:letwin-qcts]

  - id: cor:KI-discharged
    kind: corollary
    status: proved
    file: modules/kls/06-covariance-technology.tex
    statement: "Published discharge of hyp:KI: thm:KL-window plus the BL cap gives C_2=2."
    depends_on: [thm:KL-window, eq:BL-cap]

  - id: cor:KI-letwin
    kind: corollary
    status: conditional
    file: modules/kls/06-covariance-technology.tex
    statement: "Conditional Letwin-v1 sharpening of hyp:KI to C_2=1 via Klartag-Lehec Corollary 5.4."
    depends_on: [cor:letwin-window]
