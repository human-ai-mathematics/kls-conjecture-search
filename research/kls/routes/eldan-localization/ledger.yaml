  - id: rem:trace-upgrade-unification
    kind: remark
    status: proved
    file: modules/kls/14-open-targets.tex
    statement: "q:upgrade, the high-rank mean-zero part of q:stein-weighted, and q:alignment are the same operator-to-trace problem in three coordinate systems (Tr of the occupation operator M ⪯ R_0 ⪯ I). The correct target is an occupation-density bound (O(1) directions active at once), not a static effective-rank bound."
