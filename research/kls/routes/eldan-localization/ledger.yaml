  - id: heur:V2-fails
    kind: heuristic
    status: heuristic
    file: modules/kls/09-product-stress.tex
    statement: "Expected failure of (V2) on universal windows for exponential products: ∫ E X_t^2 ≳ log n. Covariance-only route expected to fail; any proof must be cut-aware."

