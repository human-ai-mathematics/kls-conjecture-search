  # MODEL GEOMETRIES
  # ---------------------------------------------------------------------------
  - id: prop:gaussian-model
    kind: proposition
    status: proved
    file: modules/kls/07-model-geometries.tex
    statement: "Gaussian model: A_t=(1+t)^{-1}I deterministic; centroid mechanism closes unconditionally; halfspace excess ≡ 0; damping strictly active."

  - id: prop:products
    kind: proposition
    status: proved
    file: modules/kls/07-model-geometries.tex
    statement: "Products: μ_t product pathwise; A_t diagonal; h_{μt} ≳ λmax(A_t)^{-1/2}; KLS holds for products (no bootstrap needed)."

  - id: prog:product-test
    kind: program
    status: open
    file: modules/kls/07-model-geometries.tex
    statement: "Product stress test completed through the dimension-dependent early window; the universal-window incident-high residue q:alignment remains open."
    unlocks: [q:alignment]

