  # PRODUCT STRESS TEST (module 09)
  # ---------------------------------------------------------------------------
  - id: lem:block
    kind: lemma
    status: proved
    file: modules/kls/09-product-stress.tex
    statement: "Block support: for product ν and J-measurable E, δ_i=0 off J and G,K supported on J×J."

  - id: thm:budget
    kind: theorem
    status: proved
    file: modules/kls/09-product-stress.tex
    statement: "Coordinate-budget theorem: k-coordinate cut of a product has E ∫_0^∞ S_t ≤ k and μ^+(E) ≥ c min(p,q)/√(1+k)."
    depends_on: [cor:per-direction, thm:scalar-riccati, prop:products]

  - id: cor:refutation
    kind: corollary
    status: proved
    file: modules/kls/09-product-stress.tex
    statement: "Single-coordinate (rank-one dynamic two-tail) counterexample candidate is REFUTED: total budget ≤1, source spikes self-extinguish (~Λ^{-2})."
    depends_on: [thm:budget]
    unlocks: [obs:rank-one-refuted]

  - id: lem:product-qcts
    kind: lemma
    status: proved
    file: modules/kls/09-product-stress.tex
    statement: "Quadratic chaos for non-isotropic products: Var(Y^T M Y) ≤ C* ||A^{1/2} M A^{1/2}||^2 (pathwise at every time)."

  - id: thm:covariance-bound
    kind: theorem
    status: conditional
    file: modules/kls/09-product-stress.tex
    statement: "Pathwise covariance bound on the source: conditional on Letwin, S_t ≤ C(1+X_t^2) for all log-concave paths on the balanced window; the product case is unconditional via lem:product-qcts."
    depends_on: [cor:qcts-source, lem:product-qcts]
    assuming: [thm:letwin-qcts]

  - id: cor:V2-implies
    kind: corollary
    status: conditional
    file: modules/kls/09-product-stress.tex
    statement: "Covariance reduction: conditional on Letwin, (V2) implies the all-cut inequality measure-by-measure for every log-concave path; for products this implication is unconditional."
    depends_on: [thm:covariance-bound]
    assuming: [thm:letwin-qcts]

  - id: thm:KL-window
    kind: theorem
    status: imported
    file: modules/kls/06-covariance-technology.tex
    statement: "Klartag–Lehec covariance window: P(∃ s≤t: ||A_s||≥2) ≤ exp(-1/(Ct)) for t ≤ 1/(C log^2 n)."
    note: "VERIFIED (2026-06-14 sweep, against arXiv PDFs): the sup-over-time / clean (log^2 n)^{-1}-window form stated here is KLnotes Thm 61, NOT polylog Lemma 5.2 (which is the weaker fixed-time, κ_n-window version). The second moment thm:V2-window needs is published as KlartagLehec2022Polylog Cor 5.4, so no 2nd-moment import debt remains. Caveat: exact statement numbering is version-dependent."

  - id: rem:kl-window-verified
    kind: remark
    status: proved
    file: modules/kls/06-covariance-technology.tex
    statement: "Verified attribution of thm:KL-window (sup-over-time form = KLnotes Thm 61) and the second moment (KlartagLehec2022Polylog Cor 5.4); discharges the hyp:KI verification flag."
    depends_on: [thm:KL-window]

  - id: prop:letwin-kappa
    kind: proposition
    status: conditional
    file: modules/kls/06-covariance-technology.tex
    statement: "Letwin QCTS implies the third-moment parameter kappa_n <= 2 sqrt(2)."
    depends_on: [thm:letwin-qcts]
    assuming: [thm:letwin-qcts]

  - id: cor:letwin-window
    kind: corollary
    status: conditional
    file: modules/kls/06-covariance-technology.tex
    statement: "For every fixed p, E||A_t||_op^p <= C_p on t <= c/log n, by Klartag-Lehec Corollary 5.4 and prop:letwin-kappa."
    depends_on: [prop:letwin-kappa, "Klartag-Lehec 2022 Corollary 5.4"]
