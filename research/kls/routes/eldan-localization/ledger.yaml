  - id: rem:taming-type-mismatch
    kind: remark
    status: proved
    file: modules/kls/14-open-targets.tex
    statement: "The naive splitting↔covariance-SDE coupling for q:taming faces a type mismatch: Ξ_T is cut-free, splitting is cut-indexed, and the split direction is the inflating one. Splitting controls the cut-aware Stein source (q:stein-weighted/q:splitting), not the cut-free Ξ_T."
    depends_on: [prop:exact-splitting, prop:ceiling]
