# ledger.yaml — canonical logical state of the KLS conditional proof program (Part III)
# =============================================================================
# SINGLE SOURCE OF TRUTH for what is proved / conditional / open / refuted in the
# KLS program, and for the dependency edges. The LaTeX in modules/kls/ is the
# prose+proof; this file is the machine-readable graph.
#
# This is Part III's control plane, ported from the standalone KLS program's roadmap ledger and
# RE-SYNCED to the unified modules/kls/ (the module numbering was reorganized when
# Part III was merged into the unified document — node `file:` paths updated; the
# \label ids are unchanged).
#
# DIFFERENT PHASE FROM THE A-SERIES. The A1-A5 ledger (../ledger.yaml, program: ab)
# is in the REFINEMENT phase (sharpen statements; numerics validate/refute via finum).
# KLS is already a PROOF program: the statements are crisp, the work is discharging
# assumptions and proving conditional implications. Hence the richer status/obstruction
# vocabulary below, and the machine-enforced no-go set (obstructions.yaml). Numerics
# (finum.localization) only REFUTE or give direction here — they never make a node "proved".
#
# status:  proved | conditional | open | heuristic | refuted | imported
# imported nodes optionally set import_class: published (default) | preprint-unreviewed;
# the latter must propagate through `assuming` and cannot underlie a proved node.
# kind:    theorem|lemma|proposition|corollary|definition|assumption|hypothesis|
#          question|program|remark|heuristic
# edges:   depends_on (acyclic; may include external free-text or \label refs),
#          assuming (the open node a conditional rests on), unlocks (forward pointers
#          only; never a duplicate of the target's depends_on/assuming), bounded_by
#          (obs:* in obstructions.yaml), discharged_by, entry_point, mechanism +
#          clearance (no-go discipline), bridges (cross-program links: program/id).
#
# Checked by ../check_ledger.py (program-aware): acyclicity, no proved-on-open/refuted,
# obstruction parity (yaml<->md<->bounded_by), mechanism vocabulary, no-go clearance,
# and cross-program bridge resolution.
# =============================================================================

meta:
  program: kls
  conjecture: "KLS: inf_n hstar_n > 0  (dimension-free Cheeger lower bound for isotropic log-concave measures)"
  best_known: "Published: hstar_n >= c (log n)^(-1/2) (Klartag 2023). Conditional on Letwin arXiv:2607.24164v1: hstar_n >= c (log n)^(-1/4)."
  routes:
    A: "All-cut absorptive two-color Carleson estimate => KLS directly. Headline: ass:all-cut-carleson."
    B: "Near-Cheeger geometric route (weighted form): weighted excess propagation + weighted stable Stein trace => KLS. Headline: ass:weighted-package."
  proof_strategy: "By contradiction against a near-worst measure (h_mu <= (1+eps) hstar_n). This is what legitimizes the bootstrap anchor."
  bridge: "A1-bis (ab/conj:a1-bis) is the structured-posterior counterpart: C_P <= K lambda_max(Cov) for GLM posteriors. The SAME bound for EVERY isotropic log-concave measure, K universal, IS this conjecture — Part I's 'Tier-infinity' boundary."
  numerics: "finum.localization (finum run --target kls-loc): diagnostic engine only. P2 weighted excess, P3 weighted Stein, P4 cut-free taming, P6 incident-high alignment, and tilted-state dynamic quadrature gates are not implemented; no route verdict is available."

# ---------------------------------------------------------------------------
# CORE STOCHASTIC LAYER  (unconditional reductions — the proved backbone)
# ---------------------------------------------------------------------------
nodes:

  - id: lem:survival-implies-kls
    kind: lemma
    status: proved
    file: modules/kls/02-mass-martingale-centroid.tex
    statement: "A positive-probability balanced posterior event at one time gives a quantitative boundary lower bound for the cut; if uniform over balanced cuts at universal constants, it implies KLS."
    depends_on: ["Bakry-Emery/Lichnerowicz", "perimeter supermartingale"]

  - id: ass:stopped-centroid
    kind: assumption
    status: open
    file: modules/kls/02-mass-martingale-centroid.tex
    statement: "Stopped centroid estimate: E ∫_0^{T∧τ} |δ_t|^2 dt ≤ CT for balanced cuts."

  - id: thm:centroid-implies-kls
    kind: theorem
    status: conditional
    file: modules/kls/02-mass-martingale-centroid.tex
    statement: "Stopped centroid estimate implies a dimension-free Cheeger lower bound (KLS)."
    depends_on: [eq:qv-p, ass:stopped-centroid, lem:survival-implies-kls]
    assuming: [ass:stopped-centroid]

  - id: lem:matrix-riccati
    kind: lemma
    status: proved
    file: modules/kls/03-riccati-identities.tex
    statement: "Matrix two-color Riccati identity: dB_t = dN_t + (s G^2 - AB - BA + rB) dt; hence dR = dÑ - (R^2 + s G^2) dt."
    depends_on: ["covariance SDE eq:cov-sde", "identity C^E - pA = sK"]

  - id: thm:scalar-riccati
    kind: theorem
    status: proved
    file: modules/kls/03-riccati-identities.tex
    statement: "Scalar Riccati: dr_t = dM_t + (S_t - D_t) dt with S=s||G||^2 the only positive source, D≥r^2 coercive."
    depends_on: [lem:matrix-riccati]

  - id: cor:per-direction
    kind: corollary
    status: proved
    file: modules/kls/03-riccati-identities.tex
    statement: "Unconditional per-direction Carleson: E ∫_0^∞ s|Gθ|^2 ≤ θ^T R_0 θ ≤ 1; i.e. E ∫ s G^2 ⪯ R_0 ⪯ I."
    depends_on: [lem:matrix-riccati]
    note: "Dimension-free at the quadratic-form level only; the trace upgrade is the missing step (q:upgrade)."

  - id: ass:all-cut-carleson
    kind: assumption
    status: open
    file: modules/kls/00-introduction.tex
    statement: "All-cut absorptive two-color Carleson: E ∫_I S_t ≤ C_0|I| + C_1 E ∫_I r_t + α E ∫_I D_t, α<1, every balanced cut."
    bounded_by: [obs:two-tail, obs:relative-ceiling, obs:proj-ceiling]

  - id: thm:carleson-implies-centroid
    kind: theorem
    status: conditional
    file: modules/kls/08-carleson-consumption.tex
    statement: "All-cut Carleson implies the stopped centroid estimate (via Gronwall on E r_{t∧τ}), hence KLS."
    depends_on: [ass:all-cut-carleson, thm:scalar-riccati, eq:qv-p, lem:survival-implies-kls]
    assuming: [ass:all-cut-carleson]

  - id: cor:tight-window-consumption
    kind: corollary
    status: proved
    file: modules/kls/08-carleson-consumption.tex
    statement: "An absorptive Carleson estimate on a fixed tight balance window yields universal balanced survival and hence a universal boundary lower bound for the cut."
    depends_on: [thm:scalar-riccati, eq:qv-p, lem:survival-implies-kls]

  - id: thm:intro-all-cut
    kind: theorem
    status: conditional
    file: modules/kls/00-introduction.tex
    statement: "Assumption all-cut-carleson implies KLS (headline of Route A)."
    depends_on: [thm:carleson-implies-centroid]
    assuming: [ass:all-cut-carleson]
    bridges: [ab/conj:a1-bis]
    note: "Bridge: the universal C_P <= K lambda_max(Cov) (every isotropic log-concave measure) IS KLS; ab/conj:a1-bis is its structured GLM counterpart."

  - id: lem:pathwise-BL
    kind: lemma
    status: proved
    file: modules/kls/08-carleson-consumption.tex
    statement: "Pathwise Brascamp–Lieb source bound: s||K||^2 ≤ 4 λmax(A)/t ≤ 4/t^2."
    depends_on: [eq:BL-cap]

  - id: cor:away-from-zero
    kind: corollary
    status: proved
    file: modules/kls/08-carleson-consumption.tex
    statement: "Source is pathwise controlled away from t=0: S_t ≤ 8/t^2 + D_t/2 on the tight window."
    depends_on: [lem:pathwise-BL]
    note: "Shows the Carleson difficulty is purely small-time and probabilistic."

  # ---------------------------------------------------------------------------
  # STATIC OBSTRUCTION LAYER (quadratic chaos / thin shell)
  # ---------------------------------------------------------------------------
  - id: def:qcts
    kind: definition
    status: proved
    file: modules/kls/05-obstruction.tex
    statement: "Quadratic-chaos thin shell Q(ν)=sup_{||M||=1} Var(X^T M X)."

  - id: thm:letwin-qcts
    kind: theorem
    status: imported
    import_class: preprint-unreviewed
    file: modules/kls/05-obstruction.tex
    statement: "Letwin quadratic Poincare inequality: for isotropic log-concave X and symmetric M, Var(X^T M X) <= 8 ||M||_HS^2."
    note: "Imported from arXiv:2607.24164v1, Theorem 1.2 (27 July 2026). Version-1 preprint, not peer reviewed; downstream improvements retain this caveat."

  - id: cor:qcts-source
    kind: corollary
    status: conditional
    file: modules/kls/05-obstruction.tex
    statement: "Whitened two-color control: s||A^(-1/2) K A^(-1/2)||_HS^2 <= 8; hence s||K||_HS^2 <= 8 lambda_max(A)^2 and, on p in [1/3,2/3], S <= 17 lambda_max(A)^2 (8 at balance)."
    depends_on: [thm:letwin-qcts, prop:stein-rep]
    assuming: [thm:letwin-qcts]

  - id: prop:qcts-equivalence
    kind: proposition
    status: proved
    file: modules/kls/05-obstruction.tex
    statement: "Time-zero: QCTS ⇔ balanced two-color bound pq||Σ_E-Σ_F||^2 ≤ C (Carbery–Wright)."
    depends_on: [def:qcts]
    bounded_by: [obs:proj-ceiling]

  # ---------------------------------------------------------------------------
  # STEIN-TRACE LAYER (Route B currency)
  # ---------------------------------------------------------------------------
  - id: prop:stein-rep
    kind: proposition
    status: proved
    file: modules/kls/04-stein-dictionary.tex
    statement: "Two-color Stein representation: ∫_E f_M dν = s⟨K,M⟩; Stein norm S_ν(E)=s^2||K||^2 = same object as Riccati source."
    unlocks: [thm:covariance-bound]

  - id: lem:stein-vs-source
    kind: lemma
    status: proved
    file: modules/kls/04-stein-dictionary.tex
    statement: "On the tight window, S_t and S_{μt}(E)/s_t are equivalent up to 64η^2 D_t (lossless conversion)."
    depends_on: [prop:stein-rep, thm:scalar-riccati]

  - id: lem:boundary-rep
    kind: lemma
    status: proved
    file: modules/kls/10-stein-route.tex
    statement: "Boundary representation for the centered Neumann Poisson problem on a smooth bounded convex support: Cov(1_E,f) = -∫_Σ ∂_n u_f dσ; support-boundary flux vanishes and trace Cauchy–Schwarz follows."

  - id: ass:weighted-package
    kind: assumption
    status: open
    file: modules/kls/00-introduction.tex
    statement: "Weighted near-Cheeger package: (i-w) weighted excess propagation + (ii-w) weighted stable Stein-trace estimate on one fixed tight window eta, with 0<=beta<1/2 and the explicit absorption margin 2 beta + 64 eta^2 < 1."
    bounded_by: [obs:two-tail]

  - id: thm:intro-weighted
    kind: theorem
    status: conditional
    file: modules/kls/00-introduction.tex
    statement: "Weighted geometric package implies KLS (headline of Route B)."
    depends_on: [ass:weighted-package, lem:stein-vs-source, cor:tight-window-consumption]
    assuming: [ass:weighted-package]
    bridges: [ab/conj:a1-bis]

  - id: prop:intro-audit
    kind: proposition
    status: proved
    file: modules/kls/00-introduction.tex
    statement: "Consumption audit: unweighted excess term is inert; unweighted Stein-trace estimate alone would imply KLS but admits no slice-wise proof."
    depends_on: [prop:trivial-excess, prop:two-tail]

  # ---------------------------------------------------------------------------
  # EXCESS PROPAGATION (audit, obstruction, circularity)
  # ---------------------------------------------------------------------------
  - id: prop:trivial-excess
    kind: proposition
    status: proved
    file: modules/kls/11-excess-propagation.tex
    statement: "Unconditional integrated excess bound: E ∫_0^{T∧τ} e_t ≤ (1+e_0) T."
    depends_on: ["perimeter supermartingale", "I_μ(1/2) ≤ 1"]

  - id: prop:two-tail
    kind: proposition
    status: proved
    file: modules/kls/05-obstruction.tex
    statement: "Quantified anisotropic two-tail config: S/s ≍ Λ^2 while e ≍ Λ^{-1/2}, r=D=0. Kills any slice-wise absolute-scale Stein estimate; calibrates weight (1+||A||)^{5/2}."
    unlocks: [obs:two-tail]

  - id: lem:perimeter-martingale
    kind: lemma
    status: proved
    file: modules/kls/11-excess-propagation.tex
    statement: "Perimeter of a fixed cut is a martingale under localization (driftless); supermartingale without compact support."

  - id: lem:excess-identity
    kind: lemma
    status: proved
    file: modules/kls/11-excess-propagation.tex
    statement: "Exact excess identity: E e_t = e_0 + [I_μ(p_0) - E I_{μt}(p_t)]. Excess propagation = drop of the localized profile."
    depends_on: [lem:perimeter-martingale]

  - id: lem:inf-martingales
    kind: lemma
    status: proved
    file: modules/kls/11-excess-propagation.tex
    statement: "The infimum over a FIXED competitor family of perimeter martingales is a supermartingale. The balanced-mass competitor family is random/time-dependent, so this does not prove that the localized profile is a supermartingale."
    depends_on: [lem:perimeter-martingale]

  # ---------------------------------------------------------------------------
  # BOOTSTRAP COMPARISON + INTERFACE FUNCTIONAL
  # ---------------------------------------------------------------------------
  - id: lem:half
    kind: lemma
    status: proved
    file: modules/kls/12-bootstrap.tex
    statement: "Balance pins the Cheeger ratio: h_ν = 2 I_ν(1/2); at p=1/2 Cheeger excess = profile excess."

  - id: lem:whitening
    kind: lemma
    status: proved
    file: modules/kls/12-bootstrap.tex
    statement: "Whitening comparison: h_ν ≥ hstar_n / λmax(A_ν)^{1/2}; hstar_n nonincreasing in n."

  - id: thm:bootstrap
    kind: theorem
    status: proved
    file: modules/kls/12-bootstrap.tex
    statement: "Bootstrap comparison: for near-worst μ and ANY balanced cut, E[ē_t 1_{t<τη}] ≤ e_0 + h_μ(ε/2+η+P(τ≤t)/2+E X_t/4); compresses propagation into h_μ Ξ_T."
    depends_on: [lem:half, lem:whitening, lem:perimeter-martingale, eq:qv-p]
    mechanism: [direct-excess]
    bounded_by: [obs:circularity]
    clearance: "Excess propagation is anchored at the external worst-case floor hstar_n (proof by contradiction against a near-worst measure), rather than assuming a lower bound for the random localized profile."
    note: "The circularity entry is a methodological warning, not a formal no-go: the moving balanced-mass competitor family is not covered by the fixed-family supermartingale lemma."

  - id: lem:crude
    kind: lemma
    status: proved
    file: modules/kls/12-bootstrap.tex
    statement: "Crude evaluation: Ξ_T(μ) ≤ 1 + log(nT)."
    depends_on: [eq:BL-cap, "Tr A_t supermartingale"]
    mechanism: [crude-bootstrap]
    bounded_by: [obs:crude-insufficient]
    clearance: "States the crude bound precisely in order to DEMONSTRATE its insufficiency (rem:insufficiency): it is never used as a KLS route, only as the lower fence the interface evaluation must beat (cor:loglog gives loglog n)."

  - id: hyp:KI
    kind: hypothesis
    status: imported
    file: modules/kls/06-covariance-technology.tex
    statement: "Known small-time operator-norm control: E||A_t||_op ≤ C_1 for t ≤ c_0(log n)^{-C_2}. (Chen / Klartag–Lehec.)"
    discharged_by: [cor:KI-discharged]
    note: "Discharged in module 06 via thm:KL-window; tail form VERIFIED (2026-06-14 sweep) = KLnotes Thm 61, moments = KlartagLehec2022Polylog Cor 5.4. Verification flag removed."

  - id: cor:loglog
    kind: corollary
    status: proved
    file: modules/kls/12-bootstrap.tex
    statement: "Polylog evaluation: under hyp:KI, Ξ_T ≤ C(1+loglog n); for T<1/8 and near-worstness error eps<=T^(1/3), gives absolute-scale excess supply T e_0 + C h_μ(T^{4/3}+1+loglog n)."
    depends_on: [thm:bootstrap, hyp:KI, cor:KI-discharged]

  - id: prop:ceiling
    kind: proposition
    status: proved
    file: modules/kls/12-bootstrap.tex
    statement: "Relative-scale ceiling: if 9(1+κ)T0<=1/2 and Ξ_T0<=κT0 for ALL isotropic log-concave measures, then KLS follows directly. This is a sufficient KLS-strength condition, not a proved equivalence."
    depends_on: [eq:qv-p, lem:survival-implies-kls]
    unlocks: [obs:relative-ceiling]

  # ---------------------------------------------------------------------------
  # GEOMETRY: second variation, Reilly, splitting (model statements; quant. open)
  # ---------------------------------------------------------------------------
  - id: prop:second-variation
    kind: proposition
    status: proved
    file: modules/kls/13-jacobi-splitting.tex
    statement: "Second variation / nonnegative index form for smooth critical local minimizers; it does not automatically apply to localized fixed near-minimizers and is not coercive modulo Jacobi zero modes."

  - id: lem:profile-bound
    kind: lemma
    status: proved
    file: modules/kls/13-jacobi-splitting.tex
    statement: "Profile bound: 𝔎_{Σp} ≤ -I''(p) I(p)^2."

  - id: cor:generic-degeneracy
    kind: corollary
    status: proved
    file: modules/kls/13-jacobi-splitting.tex
    statement: "Constant-mode degeneracy: if h_ν ≤ 1 then ∫_{1/3}^{2/3} 𝔎_{Σp} dp ≤ C h_ν^3. Splitting branch is generic in a small-Cheeger counterexample."
    depends_on: [lem:profile-bound]
    note: "Assumes existence/regularity of volume-constrained minimizers at a.e. balanced volume."

  - id: prop:reilly
    kind: proposition
    status: proved
    file: modules/kls/13-jacobi-splitting.tex
    statement: "Generalized weighted Reilly identity; converts boundary trace data into interior Dirichlet energy up to curvature boundary terms."

  - id: prop:exact-splitting
    kind: proposition
    status: proved
    file: modules/kls/13-jacobi-splitting.tex
    statement: "Two one-way model implications: global cylinder plus globally Hessian-flat direction => log-affine product; an already split log-affine factor's orthogonal halfspace has 𝔎_Σ=0. No converse from 𝔎_Σ=0 is proved."

  - id: rem:almost-stability-gap
    kind: remark
    status: proved
    file: modules/kls/13-jacobi-splitting.tex
    statement: "Foundational gap for the Jacobi route: prove a localization-uniform almost-stability trace theorem for the fixed near-Cheeger cut, modulo constants and geometric Jacobi zero modes, and control the Reilly boundary terms."
    depends_on: [prop:second-variation, prop:reilly, lem:boundary-rep]

  - id: prop:persistent-splitting
    kind: proposition
    status: proved
    file: modules/kls/13-jacobi-splitting.tex
    statement: "Splitting persists under localization: split direction preserved pathwise; A_t block-diagonal; halfspace cuts have rank-one K_t."

