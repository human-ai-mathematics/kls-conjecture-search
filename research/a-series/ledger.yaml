  - id: thm:a5-monotone
    kind: theorem
    status: proved
    file: modules/open-targets/A5-quotient-and-reparameterization.tex
    statement: "Quotient constants are never worse: C_P(pi/G) <= C_P(pi), same for C_LS, C_TCI, under the quotient metric and Dirichlet form."
