  - id: q:a3-hierarchical
    kind: question
    status: open
    file: modules/open-targets/A3-heavy-tailed-posteriors.tex
    statement: "Prove conj:a3-dependent under explicit likelihood/coupling assumptions in a joint metric with scale derivatives and cross terms; marginal coordinate constants alone are insufficient."
    depends_on: [conj:a3-dependent, prop:a3-hierarchical-prior]
