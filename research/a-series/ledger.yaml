  - id: q:a4-modified
    kind: question
    status: open
    file: modules/open-targets/A4-variational-inference.tex
    statement: "Treat the one-dimensional generalized-normal theta_p inequality as solved by thm:a4-modified-transport-1d and the global unbounded-convex-cost programme as impossible for polynomial-tail Student/horseshoe laws. For the first residual target, take the one-dimensional Student-logistic posterior pi_{nu,n}(dx) proportional to (1+x^2/nu)^(-(nu+1)/2) sigmoid(x)^n dx with nu>2 and integer n>=1, and the fixed-scale Gaussian location family Q_s={N(m,s^2)} with s>0: prove continuity and reverse-KL coercivity, delta>0, and nonempty compactness of every complete sublevel {KL<=delta+rho}; then for every rho>=0 obtain explicit matching bounds and the sharp large-rho order of the localized restricted W2^2/(2 KL) coefficient. Do not infer finiteness from a KL cutoff alone; use the named family compactness and P2 tail contract."
    depends_on: [thm:a4-modified-transport-1d]
    bounded_by: [obs:restricted-not-finite, obs:heavy-tail-no-classical]

  - id: thm:a4-modified-transport-1d
    kind: theorem
    status: imported
    import_class: published
    file: modules/open-targets/A4-variational-inference.tex
    statement: "For a nonatomic full-support log-concave law mu on R and an even continuous nondecreasing superadditive convex cost alpha with alpha(0)=0 and alpha(t)=t^2 on |t|<=1, a scaled global inequality T_{alpha(a·)}(nu,mu) <= KL(nu||mu) holds for some a>0 iff int exp(alpha(bx)) dmu(x)<infinity for some b>0; consequently exp(-|x|^p), 1<=p<=2, admits the explicit quadratic-to-p-power cost theta_p up to scaling, whereas polynomial-tail laws admit no global TCI with a nontrivial unbounded convex cost."
    references: [Gozlan2007RealLine]
    bounded_by: [obs:heavy-tail-no-classical, obs:restricted-not-finite]

