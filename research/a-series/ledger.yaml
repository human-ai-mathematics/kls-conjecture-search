  # =========================================================================
  # A4 — transport constants for variational inference
  # =========================================================================

  - id: q:a4-certificate
    kind: question
    status: open
    file: modules/open-targets/A4-variational-inference.tex
    statement: "Localized VB target: under an explicit family-coercivity/tail contract, there exists rho_0>0 such that on optimizer-centered sublevels r=delta_Q+rho with 0<=rho<=rho_0, C_{Q,r} and the localized mean constant are controlled by posterior bulk terms plus explicit remainders; global location-rich logistic constants remain prior-scale."
    bounded_by: [obs:restricted-not-finite, obs:flat-direction, obs:gaussian-tail-rigidity]
    depends_on: [thm:glm-fi]

  - id: q:a4-restricted
    kind: question
    status: open
    file: modules/open-targets/A4-variational-inference.tex
    statement: "Compute C_{Q,delta_Q+rho} for GLM and hierarchical posteriors under an explicit family-coercivity/tail contract; calibrate the well-specified small-radius limit by the Wasserstein/Fisher tangent generalized eigenvalue."
    depends_on: [q:a4-certificate]
    bounded_by: [obs:restricted-not-finite, obs:gaussian-tail-rigidity]

  - id: q:a4-mean
    kind: question
    status: open
    file: modules/open-targets/A4-variational-inference.tex
    statement: "Using the proved global and localized unrestricted cumulant duals, compute family-restricted/per-functional constants; characterize realizable entropy tilts and strict gaps such as C_mean,Q=0 with C_Q=inf."
    depends_on: [q:a4-certificate, eq:a4-mean-dual, prop:a4-mean-local]

  - id: eq:a4-mean-dual
    kind: theorem
    status: proved
    file: modules/open-targets/A4-variational-inference.tex
    label: thm:a4-mean-dual
    statement: "The unrestricted linear posterior-mean constant equals the supremum, over unit directions and nonzero tilts, of twice the centered log-MGF divided by t^2, as an extended-valued identity."
    solution: solutions/eq-a4-mean-dual.tex
    checked_by: agent
    review: research/reviews/2026-08-21-a4-a5-independent-agent-audit.md

  - id: prop:a4-mean-local
    kind: proposition
    status: proved
    file: modules/open-targets/A4-variational-inference.tex
    statement: "Under a Legendre cumulant contract, the unrestricted entropy-localized mean constant is the supremum of psi_u'(t)^2/[2(t psi_u'(t)-psi_u(t))] over tilts within the entropy radius; with a common exponential moment it equals lambda_max(Cov)+O(sqrt(r)), exactly lambda_max(Sigma) for Gaussians."
    depends_on: [eq:a4-mean-dual]
    solution: solutions/prop-a4-mean-local.tex
    checked_by: agent
    review: research/reviews/2026-08-21-a4-a5-independent-agent-audit.md

  - id: prop:a4-logistic-global
    kind: proposition
    status: proved
    file: modules/open-targets/A4-variational-inference.tex
    statement: "For a Gaussian-prior binary-logistic posterior and any Gaussian variational family containing all translations of one fixed covariance, C_mean,Q = C_Q = C_mean,all = C_TCI = lambda_max(Sigma0)."
    depends_on: [prop:a2-logistic-global, eq:a4-mean-dual]
    bounded_by: [obs:flat-direction, obs:gaussian-tail-rigidity]
    solution: solutions/prop-a4-logistic-global.tex
    checked_by: agent
    review: research/reviews/2026-08-27-a4-logistic-global-post-promotion-proof-review.md

  - id: prop:a4-local-wellspecified
    kind: proposition
    status: proved
    file: modules/open-targets/A4-variational-inference.tex
    statement: "For a compactly isolated well-specified smooth variational family, the small-radius transport and mean constants converge at O(sqrt(rho)) to generalized eigenvalues of the Wasserstein/mean tangent Gram matrices against the KL Fisher matrix."
    bounded_by: [obs:restricted-not-finite]
    solution: solutions/prop-a4-local-wellspecified.tex
    checked_by: agent
    review: research/reviews/2026-08-21-a4-a5-independent-agent-audit.md

  - id: prop:a4-local-misspecified
    kind: proposition
    status: proved
    file: modules/open-targets/A4-variational-inference.tex
    statement: "Around a compactly isolated misspecified optimizer with KL gap delta>0, the raw localized constant starts at the approximation baseline D*/(2 delta) and generically has a sqrt(rho) correction from the numerator gradient; it is not governed by the tangent generalized eigenvalue."
    bounded_by: [obs:restricted-not-finite]
    solution: solutions/prop-a4-local-misspecified.tex
    checked_by: agent
    review: research/reviews/2026-08-21-a4-a5-independent-agent-audit.md

  - id: prop:a4-local-excess
    kind: proposition
    status: proved
