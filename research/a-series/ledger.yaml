    statement: "For the Gaussian mixture with centers +/-a (separation 2a), turn component-reweighting and mode-collapse lower witnesses into rigorous family-dependent bounds; determine rather than assume their sharp separation scaling, and pair symmetry-induced cases with the quotient escape."
    depends_on: [q:a4-certificate]
