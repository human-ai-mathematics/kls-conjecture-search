# Current A-series claim graph. Statements live in modules/; schema and workflow live in
# research/ledger-schema.md and research/a-series/README.md.

meta:
  program: a-series
  scope: "Parts I & II — Bayesian-posterior functional-inequality constants (A1-A5)"

# ===========================================================================
# CROSS-CUTTING OBSTRUCTIONS  (the shared no-go knowledge; explanatory prose
# lives in research/a-series/obstructions.md)
# ===========================================================================
nodes:

  - id: obs:flat-direction
    kind: obstruction
    status: open
    file: modules/05-tier3-glm.tex
    label: prop:flat-prior-nonintegrable
    statement: "For logistic and other saturating links, likelihood curvature can vanish in remote predictor directions; the one-observation logistic family rules out any universal constant-times inverse-mode-Hessian bound. This does not cover uniformly curved GLMs or rule out every tail-free data statistic."

  - id: obs:gaussian-tail-rigidity
    kind: obstruction
    status: proved
    file: modules/open-targets/A2-bernstein-von-mises.tex
    label: prop:a2-logistic-global
    statement: "For every finite binary-logistic likelihood with Gaussian prior covariance Sigma0, the optimal global constants satisfy C_LS = C_TCI = lambda_max(Sigma0); neither can improve to the posterior/Fisher scale unless the tails or the notion of constant are changed."
    depends_on: [prop:a2-logistic-global]
    solution: solutions/a2-subquadratic-tail-rigidity.tex
    checked_by: agent
    review: research/reviews/2026-08-22-derived-obstructions-audit.md

  - id: obs:heavy-tail-no-classical
    kind: obstruction
    status: imported
    import_class: published
    file: modules/06-tier4-heavy-tails.tex
    label: thm:heavy-tail-no-lsi
    statement: "Polynomial/exponential tails admit no classical LSI, no T2, and (heaviest tails) no classical Poincare; the correct object is a weighted/weak inequality."
    references: [BobkovGotze1999, OttoVillani2000, Muckenhoupt1972]

  - id: obs:marginals-not-joint
    kind: obstruction
    status: proved
    file: modules/open-targets/A3-heavy-tailed-posteriors.tex
    label: prop:a3-marginals-not-joint
    statement: "Coordinate marginal tails and their one-dimensional Hardy constants do not control a dependent joint weighted Poincare constant: fixed-marginal copulas can create arbitrarily severe bottlenecks; a joint coefficient-scale law also needs scale derivatives in its metric."
    depends_on: [thm:a3-student]
    solution: solutions/obs-marginals-not-joint.tex
    checked_by: agent
    review: research/reviews/2026-08-22-a3-marginals-independent-audit.md

  - id: obs:tv-insufficient
    kind: obstruction
    status: proved
    file: modules/open-targets/A2-bernstein-von-mises.tex
    label: warn:a2-tv-fails
    statement: "TV-closeness to the BvM Gaussian does NOT control the constants: a contamination sequence with ||mu_n - N(0,1)||_TV -> 0 can have C_P -> inf."
    solution: solutions/obs-tv-insufficient.tex
    checked_by: agent
    review: research/reviews/2026-08-25-ab-inline-r2-audit.md

  - id: obs:symmetry-vs-physical
    kind: obstruction
    status: proved
    file: modules/open-targets/A5-quotient-and-reparameterization.tex
    label: prop:a5-ratio
    statement: "The quotient strictly improves C_P iff lambda_noninv < lambda_inv; invariant physical slow modes survive, and equality/degeneracy gives no strict gain even if a non-invariant first eigenfunction exists."
    depends_on: [prop:a5-ratio]
    solution: solutions/prop-a5-ratio.tex
    checked_by: agent
    review: research/reviews/2026-08-22-derived-obstructions-audit.md

  - id: obs:restricted-not-finite
    kind: obstruction
    status: open
    file: modules/open-targets/A4-variational-inference.tex
    label: warn:a4-heavytail
    statement: "Family-restricted transport is not automatically finite: for pi ~ e^{-|x|^p}, p<2, a Gaussian location family has C_Q = inf, and an unrestricted fixed-KL entropy ball still has infinite W2 radius. Localization needs family coercivity or quadratic-exponential tails, not a KL cutoff alone."

  # =========================================================================
  # SHARED TOOLS / BASELINES  (lemmas reused across targets; see knowledge/lemmas.md)
  # =========================================================================

  - id: lem:linear-test-lower
    kind: lemma
    status: proved
    file: modules/02-results-toolkit.tex
    label: rem:rayleigh-lower-only
    statement: "Linear-test lower bound: C_P(pi) >= lambda_max(Cov_pi); any test function f gives Var(f)/E||grad f||^2 <= C_P. The universal sound refuter."
    solution: solutions/glm-linear-baselines.tex
    checked_by: agent
    review: research/reviews/2026-08-25-ab-inline-r2-audit.md

  - id: thm:glm-fi
    kind: theorem
    status: proved
    file: modules/05-tier3-glm.tex
    statement: "Data-free GLM bound: C_P <= C_LS <= lambda_max(Sigma0), C_TCI <= lambda_max(Sigma0); dimension-free, data-free. The trivial baseline any A1/A4 bound must beat."
    solution: solutions/glm-linear-baselines.tex
    checked_by: agent
    review: research/reviews/2026-08-25-ab-inline-r2-audit.md

  - id: thm:hardy-1d
    kind: theorem
    status: imported
    import_class: published
    file: modules/02-results-toolkit.tex
    statement: "1D weighted Hardy/Muckenhoupt criterion: weighted Poincare holds iff the Hardy quantities B_+,B_- are finite, pinning the optimal constant up to factor 4."
    references: [Muckenhoupt1972, BobkovGotze1999]

  - id: lem:a5-lipschitz
    kind: lemma
    status: proved
    file: modules/open-targets/A5-quotient-and-reparameterization.tex
    statement: "Lipschitz transport: T_# nu = mu with T globally L-Lipschitz => C_P(mu) <= L^2 C_P(nu), same for C_LS, C_TCI."
    solution: solutions/a5-lipschitz-quotient.tex
    checked_by: agent
    review: research/reviews/2026-08-25-ab-inline-r2-audit.md

  # =========================================================================
  # A1 — data-informed GLM Poincare constant
  # =========================================================================

  - id: prop:a1-bulk-tail
    kind: proposition
    status: open
    file: modules/open-targets/A1-data-informed-glm.tex
    statement: "C_P <= C_M E lambda_max(H^-1); hence for every fixed Wbar the displayed bulk-plus-integrated-tail and probability-tail bounds hold."

  - id: prop:a1-euclidean-harmonic
    kind: proposition
    status: proved
    file: modules/open-targets/A1-data-informed-glm.tex
    statement: "If U is C-infinity and mI <= Hess U <= MI on Euclidean space, then C_P <= E[1/lambda_min(Hess U)] with factor one. This includes every finite Gaussian-prior logistic posterior."
    solution: solutions/a1-harmonic-mode-leverage.tex
    checked_by: agent
    review: research/reviews/2026-08-21-a1-a2-independent-agent-audit.md

  - id: prop:a1-mode-leverage
    kind: proposition
    status: proved
    file: modules/open-targets/A1-data-informed-glm.tex
    statement: "Log-Lipschitz likelihood curvature gives a mode-Hessian radial sandwich, explicit rowwise Wbar(R), a one-dimensional-quadrature tail certificate, and for bounded-Hessian models with maximal leverage eta<1 the direct bound C_P <= K_d(eta) lambda_max(Hhat^-1)."
    depends_on: [prop:a1-euclidean-harmonic]
    bounded_by: [obs:flat-direction]
    solution: solutions/a1-harmonic-mode-leverage.tex
    checked_by: agent
    review: research/reviews/2026-08-21-a1-a2-independent-agent-audit.md

  - id: cor:a1-leverage-asymptotic
    kind: corollary
    status: proved
    file: modules/open-targets/A1-data-informed-glm.tex
    statement: "In fixed dimension, bounded-Hessian log-curvature-Lipschitz posteriors with maximal mode leverage eta_n->0 satisfy C_P=(1+o(1)) lambda_max(Hhat_n^-1); if Hhat_n/n->I, this gives the Fisher-scale A2 limit."
    depends_on: [prop:a1-euclidean-harmonic, prop:a1-mode-leverage]
    solution: solutions/a1-harmonic-mode-leverage.tex
    checked_by: agent
    review: research/reviews/2026-08-21-a1-a2-independent-agent-audit.md

  - id: conj:a1
    kind: conjecture
    status: open
    file: modules/open-targets/A1-data-informed-glm.tex
    statement: "Selection target: for an explicit nontrivial class of well-identified GLMs, construct Wbar from (X,y,Sigma0), certify the prop:a1-bulk-tail bound below the prior scale, and obtain O_P(1/n) behavior in regular likelihood-dominated sequences."
    bounded_by: [obs:flat-direction]
    depends_on: [prop:a1-bulk-tail]

  - id: q:a1-poincare
    kind: question
    status: open
    file: modules/open-targets/A1-data-informed-glm.tex
    statement: "Independently certify the separate universal bulk-tail comparison and extend the proved factor-one Euclidean theorem beyond globally bounded Hessians to unbounded-Hessian Poisson GLMs, nonsmooth losses, or a precise approximation/Mosco contract."
    depends_on: [prop:a1-bulk-tail, prop:a1-euclidean-harmonic]

  - id: q:a1-barw
    kind: question
    status: open
    file: modules/open-targets/A1-data-informed-glm.tex
    statement: "Compare the explicit mode-leverage rowwise Wbar(R) with posterior-quantile and genuinely spectral constructions; the remaining target is a less conservative certificate for high-leverage instances."
    depends_on: [prop:a1-bulk-tail, prop:a1-mode-leverage]

  - id: q:a1-tail
    kind: question
    status: open
    file: modules/open-targets/A1-data-informed-glm.tex
    statement: "Improve the explicit mode-leverage radial tail ratio using posterior concentration, finite-sample Laplace, or self-improving spectral bootstraps, especially when eta>=1 makes the direct K_d certificate unavailable."
    depends_on: [prop:a1-mode-leverage, q:a1-barw]
    bounded_by: [obs:flat-direction]

  - id: q:a1-sharp
    kind: question
    status: open
    file: modules/open-targets/A1-data-informed-glm.tex
    statement: "Quantify the vanishing-leverage route at finite sample size and extend it to growing dimension, high leverage, and unbounded-Hessian likelihoods."
    depends_on: [q:a1-poincare, cor:a1-leverage-asymptotic]

  - id: q:a1-lsi
    kind: question
    status: open
    file: modules/open-targets/A1-data-informed-glm.tex
    statement: "Formulate localized/restricted or warm-start data-informed LSI/transport inequalities for logistic GLMs, and identify stronger-tail GLMs admitting a global version; a global posterior-scale logistic claim is impossible."
    depends_on: [prop:a2-logistic-global]
    bounded_by: [obs:flat-direction, obs:gaussian-tail-rigidity]

  - id: q:a1-sampling
    kind: question
    status: open
    file: modules/open-targets/A1-data-informed-glm.tex
    statement: "Translate data-informed constants into Langevin/MALA complexity and posterior-concentration rates."
    depends_on: [q:a1-poincare]

  - id: conj:a1-bis
    kind: conjecture
    status: open
    file: modules/08-open-targets.tex
    statement: "Structured-posterior KLS: C_P(pi) <= K lambda_max(Cov_pi) for a useful class of GLM posteriors, K universal or mildly geometry-dependent — the finite-sum-structured counterpart of KLS."
    bounded_by: [obs:flat-direction]
    depends_on: [conj:a1]
    bridges: [kls/conj:kls]

  # =========================================================================
  # A2 — asymptotic constants via Bernstein-von Mises
  # =========================================================================

  - id: conj:a2
    kind: conjecture
    status: open
    file: modules/open-targets/A2-bernstein-von-mises.tex
    statement: "Asymptotic FI constants: n C_P(pi_n) -> lambda_max(I(theta_0)^{-1}) under a spectral-stability/tail hypothesis; global C_LS and C_TCI have this limit only under stronger tail comparisons or n-shrinking priors."
    bounded_by: [obs:tv-insufficient, obs:gaussian-tail-rigidity]

  - id: thm:a2-target
    kind: theorem
    status: proved
    file: modules/open-targets/A2-bernstein-von-mises.tex
    statement: "In fixed dimension, if H_n/n converges in probability to I(theta_0)>0 and the mode-whitened posterior has a global Gaussian density-ratio representation with osc(r_n)=o_P(1), then C_P, C_LS, and C_TCI all equal (1+o_P(1)) lambda_max(H_n^{-1}), and each n-rescaled constant converges to lambda_max(I(theta_0)^{-1})."
    refines: conj:a2
    bounded_by: [obs:tv-insufficient, obs:gaussian-tail-rigidity]
    solution: solutions/thm-a2-target.tex
    checked_by: agent
    review: research/reviews/2026-08-27-a2-strong-laplace-post-promotion-proof-review.md

  - id: prop:a2-logistic-global
    kind: proposition
    status: proved
    file: modules/open-targets/A2-bernstein-von-mises.tex
    statement: "Every finite Gaussian-prior binary-logistic posterior has exact global C_LS = C_TCI = lambda_max(Sigma0), as a corollary of prop:a2-subquadratic-global."
    depends_on: [prop:a2-subquadratic-global]
    solution: solutions/a2-subquadratic-tail-rigidity.tex
    checked_by: agent
    review: research/reviews/2026-08-21-a1-a2-independent-agent-audit.md

  - id: prop:a2-subquadratic-global
    kind: proposition
    status: proved
    file: modules/open-targets/A2-bernstein-von-mises.tex
    statement: "A convex Gaussian-prior perturbation whose Gaussian average is o(t^2) along one top covariance direction has exact global C_LS=C_TCI=lambda_max(Sigma0); fixed finite logistic loss is a corollary, and shrinking Gaussian priors exhibit an exact local-information/global-tail tradeoff."
    solution: solutions/a2-subquadratic-tail-rigidity.tex
    checked_by: agent
    review: research/reviews/2026-08-21-a1-a2-independent-agent-audit.md

  - id: q:a2-poincare
    kind: question
    status: open
    file: modules/open-targets/A2-bernstein-von-mises.tex
    statement: "Beyond the proved fixed-dimensional logistic vanishing-leverage theorem, find the weakest random-posterior spectral-stability assumptions for the Fisher-scale C_P limit, including unbounded Hessians and growing dimension."
    depends_on: [conj:a2, cor:a1-leverage-asymptotic]

  - id: q:a2-lsi
    kind: question
    status: open
    file: modules/open-targets/A2-bernstein-von-mises.tex
    statement: "Characterize when global n C_LS and n C_TCI are Fisher-local versus governed by global PL/tail scales; Gaussian-prior logistic is an exact prior-scale counterexample, so classify tail/prior assumptions and localized alternatives."
    depends_on: [conj:a2, prop:a2-subquadratic-global]
    bounded_by: [obs:tv-insufficient, obs:gaussian-tail-rigidity]

  - id: q:a2-multimodal
    kind: question
    status: open
    file: modules/open-targets/A2-bernstein-von-mises.tex
    statement: "Multimodal/weakly-identified posteriors: when is C_P exponentially large (physical) vs a removable symmetry artifact (A5 quotient)?"
    depends_on: [conj:a2]
    bounded_by: [obs:symmetry-vs-physical]

  - id: q:a2-highdim
    kind: question
    status: open
    file: modules/open-targets/A2-bernstein-von-mises.tex
    statement: "Extend the sharp constants to growing dimension d=d_n -> inf."
    depends_on: [conj:a2]

