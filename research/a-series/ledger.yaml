    checked_by: agent
    review: research/reviews/2026-08-25-ab-inline-r2-audit.md

  - id: prop:a5-ratio
    kind: proposition
    status: proved
    file: modules/open-targets/A5-quotient-and-reparameterization.tex
    statement: "With extended restricted gaps, C_P(pi/G)=1/lambda_inv and C_P(pi)=1/min(lambda_inv,lambda_noninv); the ordinary ratio is asserted only for 0<lambda_inv<infinity, and strict gain then holds iff lambda_noninv<lambda_inv."
    depends_on: [thm:a5-monotone]
    solution: solutions/prop-a5-ratio.tex
    checked_by: agent
    review: research/reviews/2026-08-21-a4-a5-independent-agent-audit.md

  - id: prop:a5-block-stability
    kind: proposition
    status: proved
    file: modules/open-targets/A5-quotient-and-reparameterization.tex
    statement: "A G-invariant density-ratio perturbation with log-oscillation epsilon changes each invariant/non-invariant restricted gap by at most an e^{+/-epsilon} factor, preserving a strict block ordering whose logarithmic margin exceeds 2 epsilon."
    depends_on: [prop:a5-ratio]
    bounded_by: [obs:symmetry-vs-physical]
    solution: solutions/prop-a5-block-stability.tex
    checked_by: agent
    review: research/reviews/2026-08-21-a4-a5-independent-agent-audit.md

