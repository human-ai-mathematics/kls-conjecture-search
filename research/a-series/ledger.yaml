  - id: thm:a3-product
    kind: theorem
    status: proved
    file: modules/open-targets/A3-heavy-tailed-posteriors.tex
    statement: "For a finite product whose factors satisfy weighted Poincare inequalities with constants C_i, the product satisfies the diagonal-metric inequality with optimal constant max_i C_i; if B_i=max(B_{i,+},B_{i,-}), this is at most 4 max_i B_i."
    depends_on: [thm:hardy-1d]
    bounded_by: [obs:heavy-tail-no-classical, obs:marginals-not-joint]
    solution: solutions/a3-product-hierarchical-prior.tex
    checked_by: agent
    review: research/reviews/2026-08-27-a3-product-hierarchical-prior-post-promotion-proof-review.md

  - id: conj:a3-dependent
    kind: conjecture
    status: open
    file: modules/open-targets/A3-heavy-tailed-posteriors.tex
    statement: "Dependence-aware hierarchical target: conditional block inequalities plus an explicit inter-block coupling contract imply a joint inequality in the noncentered pullback metric, including scale derivatives and structural cross terms."
    bounded_by: [obs:marginals-not-joint, obs:flat-direction]
    depends_on: [thm:a3-product, prop:a3-hierarchical-prior, thm:a3-block-gibbs]

  - id: thm:a3-student
    kind: theorem
    status: imported
    import_class: published
    file: modules/open-targets/A3-heavy-tailed-posteriors.tex
    statement: "Sharp weighted Poincare for generalized Cauchy / Student-t: explicit optimal spectral gap lambda_{beta,d}. The A3 calibration theorem."
    references: [Huguet2024Cauchy, BonnefontJoulinMa2016]

  - id: prop:a3-horseshoe
    kind: proposition
    status: proved
    file: modules/open-targets/A3-heavy-tailed-posteriors.tex
    statement: "For the exact horseshoe marginal h_tau = [pi sqrt(2pi) tau]^-1 exp(a)E1(a) with weight tau^2+x^2, the optimal scale-free weighted Poincare constant is C_HS=4."
    depends_on: [thm:hardy-1d]
    bounded_by: [obs:heavy-tail-no-classical]
    solution: solutions/prop-a3-horseshoe.tex
    checked_by: agent
    review: research/reviews/2026-08-21-a3-independent-agent-audit.md

  - id: thm:a3-block-gibbs
    kind: theorem
    status: proved
    file: modules/open-targets/A3-heavy-tailed-posteriors.tex
    statement: "Uniform conditional weighted Poincare constants C_i and block-resampling gap gamma_blk>0 imply the joint constant max_i C_i/gamma_blk; for two blocks gamma_blk=1-rho_max, the HGR maximal-correlation loss."
    bounded_by: [obs:marginals-not-joint]
    solution: solutions/thm-a3-block-gibbs.tex
    checked_by: agent
    review: research/reviews/2026-08-21-a3-independent-agent-audit.md

  - id: prop:a3-hierarchical-prior
    kind: proposition
    status: proved
    file: modules/open-targets/A3-heavy-tailed-posteriors.tex
    statement: "For every finite d, mutually independent standard Gaussians Z_j and log-half-Cauchy variables U,V_j, with Theta_j=exp(U+V_j)Z_j, the hierarchical prior has optimal weighted Poincare constant 4 in the full pullback metric including all coefficient-scale cross terms."
    depends_on: [thm:a3-student]
    bounded_by: [obs:heavy-tail-no-classical, obs:marginals-not-joint]
    solution: solutions/a3-product-hierarchical-prior.tex
