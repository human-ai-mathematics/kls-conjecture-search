    file: modules/open-targets/A5-quotient-and-reparameterization.tex
    statement: "For mu_epsilon proportional to exp(-H/epsilon), where H is a C3 Morse potential satisfying the stated growth hypotheses and having exactly two equal-depth nondegenerate minima joined through a unique nondegenerate index-one saddle, C_P obeys the Menz-Schlichting Eyring-Kramers formula with relative error O(sqrt(epsilon)|log epsilon|^(3/2)); hence for epsilon=1/n, n^{-1} log C_P converges to the communication height."
    references: [MenzSchlichting2014]
    bounded_by: [obs:symmetry-vs-physical]

