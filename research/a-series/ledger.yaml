# ledger.yaml — canonical state of the open-target program (Parts I & II)
# =============================================================================
# Machine-readable claim graph for A1-A5. The manuscript owns the complete statements and
# prose; this ledger owns their current state, proof dependencies, obstructions, provenance,
# and certification pointers. It records neither workflow history nor numerical proof.
#
# Schema: research/a-series/README.md, section "Ledger schema". In brief:
#   kind    = mathematical form only
#             theorem|proposition|lemma|corollary|conjecture|question|obstruction|example
#   status  = epistemic state only
#             open|proved|imported|refuted
#
# An id is normally the statement's LaTeX label. A stable synthetic id must declare `label`,
# and `file` must contain that effective label. `refines` is reserved for a genuine semantic
# sharpening of another statement; it is not a manuscript-location field.
#
# Imported nodes require `import_class` and `references` (BibTeX keys in fi_references.bib).
# Proved nodes require a certified standalone `solution`. Numerical fields are orthogonal to
# status and never validate a claim or proof.
#
# Canonical logical edges:
#   depends_on   premises actually used by the proof; acyclic
#   bounded_by   obstruction nodes that constrain a valid statement/proof
#   bridges      explicit cross-program links written as program/id
# =============================================================================

meta:
  program: ab
  scope: "Parts I & II — Bayesian-posterior functional-inequality constants (A1-A5)"

# ===========================================================================
# CROSS-CUTTING OBSTRUCTIONS  (the shared no-go knowledge; prose + numerical
# diagnostic role live in research/a-series/obstructions.md)
# ===========================================================================
nodes:

  - id: obs:flat-direction
    kind: obstruction
    status: open
    file: modules/05-tier3-glm.tex
    label: prop:flat-prior-nonintegrable
    statement: "For logistic and other saturating links, likelihood curvature can vanish in remote predictor directions; the one-observation logistic family rules out any universal constant-times inverse-mode-Hessian bound. This does not cover uniformly curved GLMs or rule out every tail-free data statistic."
    numerics: "Separable logistic: compare each specified local-curvature upper proposal with a rigorously controlled lower bound; only a proposal whose RHS falls below that lower bound is falsified."

  - id: obs:gaussian-tail-rigidity
    kind: obstruction
    status: proved
    file: modules/open-targets/A2-bernstein-von-mises.tex
    label: prop:a2-logistic-global
    statement: "For every finite binary-logistic likelihood with Gaussian prior covariance Sigma0, the optimal global constants satisfy C_LS = C_TCI = lambda_max(Sigma0); neither can improve to the posterior/Fisher scale unless the tails or the notion of constant are changed."
    depends_on: [prop:a2-logistic-global]
    solution: solutions/a2-subquadratic-tail-rigidity.tex
    checked_by: agent
    authored_by: /root/a1_a2
    reviewed_by: /root/audit_metadata
    review: research/reviews/2026-08-22-derived-obstructions-audit.md
    numerics: "Analytic obstruction. Any finite-n logistic claim with global C_LS or C_TCI below lambda_max(Sigma0) must be falsified; local/restricted constants are tested separately."

  - id: obs:heavy-tail-no-classical
    kind: obstruction
    status: imported
    import_class: published
    file: modules/06-tier4-heavy-tails.tex
    label: thm:heavy-tail-no-lsi
    statement: "Polynomial/exponential tails admit no classical LSI, no T2, and (heaviest tails) no classical Poincare; the correct object is a weighted/weak inequality."
    references: [BobkovGotze1999, OttoVillani2000, Muckenhoupt1972]
    numerics: "Generalized-Cauchy mu_beta: unweighted Hardy functional ~ x^2 -> inf (C_P=inf); weighted by (1+x^2) -> O(1)."

  - id: obs:marginals-not-joint
    kind: obstruction
    status: proved
    file: modules/open-targets/A3-heavy-tailed-posteriors.tex
    label: prop:a3-marginals-not-joint
    statement: "Coordinate marginal tails and their one-dimensional Hardy constants do not control a dependent joint weighted Poincare constant: fixed-marginal copulas can create arbitrarily severe bottlenecks; a joint coefficient-scale law also needs scale derivatives in its metric."
    depends_on: [thm:a3-student]
    solution: solutions/obs-marginals-not-joint.tex
    checked_by: agent
    authored_by: /root/a3
    reviewed_by: /root/audit_latex
    review: research/reviews/2026-08-22-a3-marginals-independent-audit.md
    numerics: "Analytic fixed-marginal copula counterexample; future dependence-aware tests must vary the copula while holding every marginal fixed."

  - id: obs:tv-insufficient
    kind: obstruction
    status: proved
    file: modules/open-targets/A2-bernstein-von-mises.tex
    label: warn:a2-tv-fails
    statement: "TV-closeness to the BvM Gaussian does NOT control the constants: a contamination sequence with ||mu_n - N(0,1)||_TV -> 0 can have C_P -> inf."
    solution: solutions/obs-tv-insufficient.tex
    checked_by: agent
    authored_by: /root/ab_legacy_author
    reviewed_by: /root/kls_core_author
    review: research/reviews/2026-08-25-ab-inline-r2-audit.md
    numerics: "mu_n=(1-eps_n)N(0,1)+eps_n N(a_n,1), eps_n a_n^2 -> inf: the exact variance lower bound diverges while TV -> 0."

  - id: obs:symmetry-vs-physical
    kind: obstruction
    status: proved
    file: modules/open-targets/A5-quotient-and-reparameterization.tex
    label: prop:a5-ratio
    statement: "The quotient strictly improves C_P iff lambda_noninv < lambda_inv; invariant physical slow modes survive, and equality/degeneracy gives no strict gain even if a non-invariant first eigenfunction exists."
    depends_on: [prop:a5-ratio]
    solution: solutions/prop-a5-ratio.tex
    checked_by: agent
    authored_by: /root/a4_a5
    reviewed_by: /root/audit_metadata
    review: research/reviews/2026-08-22-derived-obstructions-audit.md
    numerics: "Folded double well (ex:a5-folding): test the two restricted spectral blocks separately; lower estimates alone do not certify the raw asymptotic."

  - id: obs:restricted-not-finite
    kind: obstruction
    status: open
    file: modules/open-targets/A4-variational-inference.tex
    label: warn:a4-heavytail
    statement: "Family-restricted transport is not automatically finite: for pi ~ e^{-|x|^p}, p<2, a Gaussian location family has C_Q = inf, and an unrestricted fixed-KL entropy ball still has infinite W2 radius. Localization needs family coercivity or quadratic-exponential tails, not a KL cutoff alone."
    numerics: "q_m=N(m,sigma^2), pi~e^{-|x|^p}: the analytic ratio W2^2/KL ~ |m|^{2-p} -> inf as |m|->inf; finite grids are directional only."

