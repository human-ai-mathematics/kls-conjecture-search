  - id: q:a3-horseshoe
    kind: question
    status: open
    file: modules/open-targets/A3-heavy-tailed-posteriors.tex
    statement: "For likelihood tilts of the horseshoe marginal, find conditions weaker than bounded density ratio that preserve a finite weighted gap, quantify departure from the prior value 4, and identify when the likelihood changes the appropriate tail metric."
    depends_on: [prop:a3-horseshoe]

  - id: q:a3-catalogue
    kind: question
    status: open
    file: modules/open-targets/A3-heavy-tailed-posteriors.tex
    statement: "Build the scale-mixture catalogue: per robust-Bayes prior record tail index, weighted Hardy constant, Stein-kernel constant (alpha>1)."
