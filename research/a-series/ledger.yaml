  - id: lem:a4-symmetrization
    kind: lemma
    status: proved
    file: modules/open-targets/A4-variational-inference.tex
    statement: "Group-averaging q preserves invariant observables and does not increase either KL(q||pi) or W2^2(q,pi) for an invariant target; use inside VI only when the family admits the average, and do not infer an ordering of the ratio."
    bounded_by: [obs:symmetry-vs-physical]
