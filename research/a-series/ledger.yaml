  - id: conj:a3
    kind: conjecture
    status: refuted
    file: modules/open-targets/A3-heavy-tailed-posteriors.tex
    label: warn:a3-marginal-only
    statement: "Refuted marginal-only form: polynomial coordinate tails and their one-dimensional Hardy constants do not by themselves control a dependent joint weighted Poincare constant."
