  - id: thm:bootstrap
    kind: theorem
    status: proved
    provenance: internal
    file: modules/kls/25-bootstrap.tex
    summary: 'Let $n\ge2$, $\epsilon\in(0,1]$, $\mu$ be isotropic log-concave with $h_\mu \le (1+\epsilon)h^*_n$, $E$ be any balanced cut, and $\eta\in(0,1/2)$. Then for every $t>0$, $\mathbb{E}[\bar{e}_t\mathbf{1}_{t<\tau_\eta}] \le e_0+h_\mu(\epsilon/2+\eta+\mathbb{P}(\tau_\eta\le t)/2+\mathbb{E}X_t/4)$, and $\mathbb{P}(\tau_\eta\le t) \le (t+\int_0^t\mathbb{E}X_s\,ds)/(4\eta^2)$; integration yields the stated $h_\mu\Xi_T$ bound and, for $T<1/8$, $\eta=T^{1/3}$, $\epsilon\le T^{1/3}$, the clean bound $Te_0+Ch_\mu(T^{4/3}+\Xi_T)$.'
    depends_on: ['lem:half', 'lem:whitening', 'lem:perimeter-martingale']
    heuristic_barriers: ['obs:circularity']
    proofs:
      - artifact: solutions/kls-bootstrap-interface.tex
        mode: agent
        review: research/reviews/2026-08-27-thm-bootstrap-semantic-repair-proof-review.md

  - id: thm:bootstrap-stopped-interface
    kind: theorem
    status: proved
    provenance: internal
    file: modules/kls/25-bootstrap.tex
    summary: 'Under the near-worst hypotheses of the bootstrap comparison, let $\widehat{\Xi}_{T,\eta}(\mu,E)=\int_0^T\mathbb{E}[X_s\mathbf{1}_{s<\tau_\eta}]\,ds$. Then $\int_0^T\mathbb{E}[\bar{e}_t(E)\mathbf{1}_{t<\tau_\eta}]\,dt \le Te_0+h_\mu[(\epsilon/2+\eta)T+T^2/(16\eta^2)+(T/(8\eta^2)+1/4)\widehat{\Xi}_{T,\eta}]$. For $T<1/8$, $\eta=T^{1/3}$, and $\epsilon\le T^{1/3}$, this is at most $Te_0+Ch_\mu(T^{4/3}+\widehat{\Xi}_{T,\eta})$.'
    depends_on: ['lem:half', 'lem:whitening', 'lem:perimeter-martingale']
    heuristic_barriers: ['obs:circularity', 'obs:relative-ceiling']
    proofs:
      - artifact: solutions/thm-bootstrap-stopped-interface.tex
        mode: agent
        review: research/reviews/2026-08-27-thm-bootstrap-stopped-interface-proof-review.md

