  - id: prop:stein-rep
    kind: proposition
    status: proved
    provenance: internal
    file: modules/kls/13-stein-dictionary.tex
    summary: 'Two-color Stein representation: $\int_E f_M\,d\nu = s\langle K,M\rangle$ and Stein norm $\mathcal{S}_\nu(E)=s^2\|K\|^2$. At balance $K=G$ and $\mathcal{S}/s$ equals the Riccati source $s\|G\|^2$; off balance the tight-window conversion between Stein norm and Riccati source supplies it.'
    proofs:
      - artifact: solutions/kls-qcts-stein-boundary-core.tex
        mode: agent
