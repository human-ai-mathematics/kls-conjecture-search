        mode: agent
        review: research/reviews/2026-08-25-kls-core-r2-audit.md

  - id: thm:intro-all-cut
    kind: theorem
    status: open
    provenance: internal
    file: modules/kls/20-eldan-statements.tex
    summary: Assumption all-cut-carleson implies KLS (headline of Eldan-A).
    depends_on: ['thm:carleson-implies-centroid']

  - id: lem:pathwise-BL
    kind: lemma
    status: proved
    provenance: internal
    file: modules/kls/21-carleson.tex
    summary: 'Pathwise Brascamp--Lieb source bound: $s\|K\|^2 \le 4\lambda_{\max}(A)/t \le 4/t^2$.'
    depends_on: ['prop:stein-rep']
    proofs:
      - artifact: solutions/kls-localization-riccati-core.tex
        mode: agent
        review: research/reviews/2026-08-25-kls-core-r2-audit.md

  - id: lem:lyapunov-stein-duality
    kind: lemma
    status: proved
    provenance: internal
    file: modules/kls/21-carleson.tex
    summary: 'For $t>0$, on the covariance support $H_t=\mathrm{Ran}(A_t)$, let $L_A(M)=(AM+MA)/2$ and interpret $L_A^{-1}$ as the inverse on $\mathrm{Sym}(\mathrm{Ran}(A))$, extended by zero. Then $s\langle K,L_A^{-1}K\rangle \le 4/t$. For $K \ne 0$ set $\lambda_{\mathrm{cut}}(A,K)=\|K\|_{\mathrm{HS}}^2/\langle K,L_A^{-1}K\rangle$, and set $\lambda_{\mathrm{cut}}(A,0)=0$; hence $s\|K\|_{\mathrm{HS}}^2 \le 4\lambda_{\mathrm{cut}}(A,K)/t$. If $A,B$ are positive semidefinite and $K$ is supported on $\mathrm{Ran}(A)$, then $\lambda_{\mathrm{cut}}(A\oplus B,K\oplus 0)=\lambda_{\mathrm{cut}}(A,K)$.'
    depends_on: ['lem:pathwise-BL', 'prop:two-tail']
    proofs:
      - artifact: solutions/lem-lyapunov-stein-duality.tex
        mode: agent
        review: research/reviews/2026-08-27-lem-lyapunov-stein-duality-repair-proof-review.md

  - id: cor:away-from-zero
    kind: corollary
    status: proved
    provenance: internal
    file: modules/kls/21-carleson.tex
    summary: 'Source is pathwise controlled away from $t=0$: $S_t \le 8/t^2 + D_t/2$ on the tight window.'
    depends_on: ['lem:pathwise-BL', 'lem:stein-vs-source', 'thm:scalar-riccati']
    proofs:
      - artifact: solutions/kls-localization-riccati-core.tex
        mode: agent
        review: research/reviews/2026-08-25-kls-core-r2-audit.md

  # ---------------------------------------------------------------------------
  # ROUTE-AGNOSTIC MOMENT-MAP INPUTS
  # ---------------------------------------------------------------------------
  - id: thm:regular-moment-map-compact-target
    kind: theorem
    status: proved
    provenance: literature
    file: modules/kls/04-family-moment-map.tex
    summary: 'If $P$ is a convex body and $\mu(dx)=g(x)\mathbf{1}_{\mathrm{int}(P)}(x)\,dx$ is a centered probability with positive smooth $g$, then its canonical moment potential is smooth and strictly convex, its gradient is a diffeomorphism from $\mathbb{R}^n$ onto $\mathrm{int}(P)$, and the target-coordinate Hessian is a smooth positive symmetric Stein kernel satisfying $\mathrm{Div}_\mu H=-x$ and $\mathbb{E}_\mu H=\mathrm{Cov}(\mu)$.'
    import_class: published
    references: [BermanBerndtsson2013RealMA, Fathi2019SteinMomentMaps]

  - id: thm:chen-klartag-moment-hessian
    kind: theorem
    status: open
    provenance: literature
    file: modules/kls/04-family-moment-map.tex
    summary: 'Chen--Klartag moment-Hessian estimate: for the regular moment map of an isotropic log-concave measure, $\mathbb{E}_\nu\|D^2\varphi\|_{\mathrm{HS}}^2 \le 2n$.'
    import_class: preprint-unreviewed
    references: [ChenKlartag2026SharpThinShell]

  - id: thm:chen-klartag-thin-shell
    kind: theorem
    status: open
    provenance: literature
    file: modules/kls/04-family-moment-map.tex
    summary: 'Chen--Klartag sharp thin shell: $\mathrm{Var}(|X|^2) \le 8n$ for isotropic log-concave $X$, with equality for products of standard centered one-sided exponentials.'
    import_class: preprint-unreviewed
    references: [ChenKlartag2026SharpThinShell]
    depends_on: ['thm:chen-klartag-moment-hessian']

  - id: thm:chen-klartag-third-moment
    kind: theorem
    status: open
    provenance: literature
    file: modules/kls/04-family-moment-map.tex
    summary: 'Chen--Klartag sharp full third-moment tensor: $\|T_3(X)\|_{\mathrm{HS}}^2 \le 4n$ for isotropic log-concave $X$.'
    import_class: preprint-unreviewed
    references: [ChenKlartag2026SharpThinShell]
    depends_on: ['thm:chen-klartag-moment-hessian']

  - id: thm:letwin-moment-map
    kind: theorem
    status: open
    provenance: literature
    file: modules/kls/04-family-moment-map.tex
    summary: 'Under Letwin''s regular moment-map assumptions, for every constant symmetric $B$, $\mathbb{E}_\nu\,\mathrm{tr}(BHBH) \le 2\,\mathrm{tr}(B^2)$.'
    import_class: preprint-unreviewed
    references: [Letwin2026QuadraticKLS]

  - id: thm:kl-stopped-rank-tail
    kind: theorem
    status: open
    provenance: literature
    file: modules/kls/15-covariance-technology.tex
    summary: 'For simplified stochastic localization of an isotropic compactly supported log-concave law, every stopping time $\sigma$ and $t>0$ satisfy $\sum_i \mathbb{P}(\lambda_i(A_{t\wedge\sigma})\ge 3) \le Cn\exp(-t^{-1/8})$; consequently the rank-$k$ entrance time $\sigma_k$ obeys $\mathbb{P}(\sigma_k\le t)\le C(n/k)\exp(-t^{-1/8})$ and $\mathbb{E}\,\sigma_k^{-2}\le C(1+\log(n/k))^{16}$.'
    import_class: preprint-unreviewed
    references: [KlartagLehec2025ThinShell]

  - id: thm:kl-integrated-rank-covariance
    kind: theorem
    status: open
    provenance: literature
    file: modules/kls/15-covariance-technology.tex
    summary: 'For simplified stochastic localization of an isotropic compactly supported log-concave law, $\mathbb{E}\sum_i\exp\left(2\int_0^1\lambda_i(A_t)\,dt\right) \le Cn$.'
    import_class: preprint-unreviewed
    references: [KlartagLehec2025ThinShell]

  - id: thm:improved-lichnerowicz
    kind: theorem
    status: proved
    provenance: literature
    file: modules/kls/03-family-bochner-hminus1.tex
    summary: 'Klartag''s improved Lichnerowicz estimate: if $\mu=e^{-U}dx$ on $\mathbb{R}^n$ has $\mathrm{Hess}\,U \ge tI$ for some $t>0$, then $C_P(\mu) \le \sqrt{\|\mathrm{Cov}\,\mu\|_{\mathrm{op}}/t}$.'
    import_class: published
    references: [Klartag2023Logarithmic]

  - id: prop:covariance-spike
    kind: proposition
    status: proved
    provenance: literature
    file: modules/kls/00-orientation.tex
    summary: 'For $n$ independent centered rate-one exponentials and independent standard Gaussian $G$, $\mathbb{P}(\|\mathrm{Cov}(X\mid X+\sqrt{s}G)\|_{\mathrm{op}} \ge c_{\mathrm{sp}}s) \ge 1-(1-e^{-s}/2)^n$. Hence for $s\le\log n$ the event has universal positive probability and the expected operator norm is at least $cs$.'
    import_class: published
    references: [KLnotes]

  - id: lem:one-dimensional-density-variance
    kind: lemma
    status: proved
    provenance: literature
    file: modules/kls/27-eldan-open-targets.tex
    summary: 'For every one-dimensional log-concave probability density $f$ of variance $v>0$, $1/12 \le v\|f\|_\infty^2 \le 1$; consequently every quantile halfline has boundary density at most $v^{-1/2}$.'
    import_class: published
    references: [BobkovChistyakov2015Concentration]

