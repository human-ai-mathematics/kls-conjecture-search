        mode: agent
        review: research/reviews/2026-08-27-prop-cmh-hodge-domain-repair-proof-review.md

  - id: conj:gate-zero
    kind: conjecture
    status: open
    provenance: internal
    file: modules/kls/41-cmh-normalization.tex
    summary: 'Gate zero: $\mathbb{E}[H\Sigma^{-1}H] \le 4\Sigma$ in the Loewner order for every centered log-concave moment measure; equivalently $\mathbb{E}H^2 \le 4\,\mathrm{Id}$ in isotropic position.'

  - id: prop:letwin-not-gate-zero
    kind: proposition
    status: proved
    provenance: internal
    file: modules/kls/41-cmh-normalization.tex
    summary: 'For every $m$ at least $18$ there is a random PSD $(m+1)\times(m+1)$ matrix $H$ with $\mathbb{E}H=\mathrm{Id}$ satisfying $\mathbb{E}\,\mathrm{Tr}(BHBH) \le 2\,\mathrm{Tr}(B^2)$ for EVERY symmetric $B$, yet $\lambda_{\max}(\mathbb{E}H^2) \ge 1+m/\sqrt{2m-1} > 4$. Hence positivity, normalization and the constant-matrix estimate do not imply gate zero by matrix algebra; the entire gap is the static commutator, $\mathrm{Tr}(B^2H^2) = \mathrm{Tr}(BHBH) + (1/2)\|[B,H]\|_{\mathrm{HS}}^2$.'
    proofs:
      - artifact: solutions/thm-cmh-normalization.tex
        mode: agent
        review: research/reviews/2026-08-25-kls-cmh-normalization-repair-audit.md

  - id: rem:gate-zero-trace-upgrade
    kind: corollary
    status: open
    provenance: internal
    file: modules/kls/41-cmh-normalization.tex
    summary: 'Gate zero is an operator-to-trace upgrade with a factor-$2$ budget: Chen--Klartag give $\mathrm{Tr}(\mathbb{E}H^2) \le 2n$, so the average eigenvalue of $\mathbb{E}H^2$ is already at most $2$ in isotropic position, while gate zero asks the maximum to be at most $4$.'
    depends_on: ['thm:chen-klartag-moment-hessian', 'prop:letwin-not-gate-zero']

  - id: lem:cmh-linear-spectral-resolution
    kind: lemma
    status: proved
    provenance: internal
    file: modules/kls/41-cmh-normalization.tex
    summary: 'For a regular isotropic compact-target moment map with source potential $\psi$, Stein generator $A_{\mathrm{op}}=-L$ in source coordinates, and columns $Ha=\nabla(\partial_a\psi)$: the $u_b=\partial_b\psi$ are centered orthonormal eigenfunctions of $A_{\mathrm{op}}$ at its Brascamp--Lieb spectral gap $1$; the columns lie in the form domain and satisfy the weak column equation $\mathcal{E}(f,Ha) = \langle f,Ha\rangle - \langle f,(A+Q)a\rangle$ for bounded smooth finite-energy $f$, with $(A+Q)a \in L^1$ orthogonal to every $u_b$ and $\mathbb{E}[A+Q]=I$; and with the induced decomposition $Ha = a + \sum_b M_{ab}u_b + v$ one has $a^T N a = 1+|M_a|^2+|v|^2$, $a^T D a = |M_a|^2+\langle v,A_{\mathrm{op}}v\rangle$, $a^T R a = 1 - \langle v,(A_{\mathrm{op}}-1)v\rangle$, where $\langle v,A_{\mathrm{op}}v\rangle$ is the closed-form value. Consequently $R \le I$ with equality iff the column fluctuation is spectrally pure at the gap; $(\mathrm{AB})_{\rho,\beta}$ is equivalent to $\langle v,(A_{\mathrm{op}}-1)v\rangle + \rho(|M_a|^2+|v|^2) \le 1+\beta-\rho$ for all unit $a$; $R \ge N-nI$ holds unconditionally; and $R \ge D$ holds for all regular finite products of one-dimensional laws.'
    depends_on: ['thm:regular-moment-map-compact-target', 'def:cmh']
    proofs:
      - artifact: solutions/lem-cmh-linear-spectral-resolution.tex
        mode: agent
        review: research/reviews/2026-09-06-lem-cmh-linear-spectral-resolution-proof-review.md

