    provenance: internal
    file: modules/kls/23-stein-route.tex
    summary: 'Boundary representation for the centered Neumann Poisson problem on a smooth bounded convex support: $\mathrm{Cov}(\mathbf{1}_E,f) = -\int_\Sigma \partial_n u_f\,d\sigma$; support-boundary flux vanishes and trace Cauchy--Schwarz follows.'
    proofs:
