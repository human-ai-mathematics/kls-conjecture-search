# Current KLS claim graph. Statements live in modules/kls/; the schema is
# research/program/ledger-schema.md and the search state is research/program/.

meta:
  program: kls
  scope: "The KLS conjecture: a universal Poincare/Cheeger bound for every isotropic log-concave measure, in every dimension."

nodes:

  # ---------------------------------------------------------------------------
  # OBSTRUCTIONS
  # ---------------------------------------------------------------------------
  - id: obs:two-tail
    kind: obstruction
    status: open
    provenance: internal
    file: modules/kls/14-qcts-obstruction.tex
    summary: The anisotropic Gaussian two-tail cut rules out a slice-wise stable Stein estimate with an absolute-scale excess term; covariance weight or expected-occupation control is necessary.
    depends_on: ['prop:two-tail']

  - id: obs:proj-ceiling
    kind: obstruction
    status: open
    provenance: internal
    file: modules/kls/14-qcts-obstruction.tex
    summary: Radial and projection-only tests yield at best a logarithmic quadratic-chaos bound and cannot supply the dimension-free operator control required by the route.

  - id: obs:crude-insufficient
    kind: obstruction
    status: open
    provenance: internal
    file: modules/kls/25-bootstrap.tex
    summary: 'The crude estimate $\Xi_T \le 1+\log(nT)$ is too large to close the excess bootstrap at known KLS lower-bound scales.'
    depends_on: ['lem:crude']

  - id: obs:relative-ceiling
    kind: obstruction
    status: open
    provenance: internal
    file: modules/kls/25-bootstrap.tex
    summary: 'A universal relative-scale estimate $\Xi_{T_0} \le \kappa T_0$ at sufficiently small fixed time already implies KLS and is not a weaker bootstrap input.'
    depends_on: ['prop:ceiling']

  - id: obs:circularity
    kind: obstruction
    status: open
    provenance: internal
    file: modules/kls/24-excess-propagation.tex
    summary: Directly inserting a lower bound for the time-dependent localized isoperimetric profile risks assuming the Cheeger control the route is meant to prove.
    depends_on: ['lem:excess-identity', 'lem:inf-martingales']

  - id: obs:rank-one-refuted
    kind: obstruction
    status: open
    provenance: internal
    file: modules/kls/22-product-stress.tex
    summary: For products, a fixed balanced single-coordinate cut has total expected source budget at most one and cannot sustain a covariance-inflation counterexample.
    depends_on: ['cor:refutation']

