  - id: lem:perimeter-martingale
    kind: lemma
    status: proved
    provenance: internal
    file: modules/kls/24-excess-propagation.tex
    summary: For every fixed Borel cut E with finite initial lower outer Minkowski perimeter, the process mu_t^+(E) is an integrable nonnegative supermartingale. If the initial density is smooth and compactly supported and E has C2 boundary with a tubular neighborhood over that support, the same lower Minkowski perimeter is a true martingale with the displayed driftless weighted-surface SDE.
    proofs:
      - artifact: solutions/kls-excess-audit.tex
        mode: agent
        review: research/reviews/2026-08-27-kls-excess-repair-w0r2-proof-review.md

  - id: lem:excess-identity
    kind: lemma
    status: proved
    provenance: internal
    file: modules/kls/24-excess-propagation.tex
    summary: If the initial density is smooth and compactly supported and E has C2 boundary with a tubular neighborhood over that support, then E e_t = e_0 + [I_μ(p_0) - E I_{μt}(p_t)]; in this class excess propagation is exactly the drop of the localized profile.
    depends_on: ['lem:perimeter-martingale']
    proofs:
      - artifact: solutions/kls-excess-audit.tex
        mode: agent
        review: research/reviews/2026-08-27-kls-excess-repair-w0r2-proof-review.md

  - id: lem:inf-martingales
    kind: lemma
    status: proved
    provenance: internal
    file: modules/kls/24-excess-propagation.tex
    summary: The infimum over a fixed nonempty countable family of Borel sets with finite initial lower outer Minkowski perimeter is a supermartingale because each fixed-cut perimeter is a supermartingale (a martingale in the stated smooth compact-support class); the same holds with a fixed countable determining subfamily. Mere measurability of an uncountable family is insufficient. The balanced-mass family is random/time-dependent, so this does not prove that the localized profile is a supermartingale.
    depends_on: ['lem:perimeter-martingale']
    proofs:
      - artifact: solutions/kls-excess-audit.tex
