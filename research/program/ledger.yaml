    provenance: internal
    file: modules/kls/13-stein-dictionary.tex
    summary: 'For $0<\eta\le 1/4$, on $\{t<\tau_\eta\}$, $S_t \le 2\mathcal{S}_{\mu_t}(E)/s_t + 64\eta^2 D_t$ and $\mathcal{S}_{\mu_t}(E)/s_t \le 2S_t + 64\eta^2 D_t$.'
    depends_on: ['prop:stein-rep', 'thm:scalar-riccati']
