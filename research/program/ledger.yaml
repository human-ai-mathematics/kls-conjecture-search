  - id: def:cheeger-excess
    kind: definition
    status: defined
    provenance: internal
    file: modules/kls/25-bootstrap.tex
    summary: 'Excess over the Cheeger line rather than over the profile: $\bar{e}_t(E) = \mu_t^+(E) - h_{\mu_t}\min(p_t,q_t) \ge e_t(E) \ge 0$. It is the quantity that propagates through the bootstrap, and $\bar{e}\ge e$ means any consumption stated for $e$ is implied.'

  - id: lem:whitening
    kind: lemma
    status: proved
    provenance: internal
    file: modules/kls/25-bootstrap.tex
