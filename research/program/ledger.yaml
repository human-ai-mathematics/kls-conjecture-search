  # CORE STOCHASTIC LAYER
  # ---------------------------------------------------------------------------
  - id: conj:kls
    kind: conjecture
    status: open
    provenance: internal
    file: modules/kls/00-orientation.tex
    summary: 'There is a universal $C$ such that $\mathrm{Var}_\mu(f) \le C\int|\nabla f|^2\,d\mu$ for every isotropic log-concave $\mu$ in every dimension; equivalently up to universal constants, $\inf_n h^*_n > 0$.'

  - id: lem:survival-implies-kls
    kind: lemma
    status: proved
    provenance: internal
    file: modules/kls/11-mass-martingale.tex
    summary: A positive-probability balanced posterior event at one time gives a quantitative boundary lower bound for the cut; if uniform over balanced cuts at universal constants, it implies KLS.
    proofs:
      - artifact: solutions/kls-localization-riccati-core.tex
        mode: agent
        review: research/reviews/2026-08-25-kls-core-r2-audit.md

  - id: ass:stopped-centroid
    kind: assumption
    status: open
    provenance: internal
    file: modules/kls/11-mass-martingale.tex
    summary: 'Stopped centroid estimate: $\mathbb{E}\int_0^{T\wedge\tau}|\delta_t|^2\,dt \le CT$ for balanced cuts.'

  - id: thm:centroid-implies-kls
    kind: theorem
    status: open
    provenance: internal
    file: modules/kls/11-mass-martingale.tex
    summary: Stopped centroid estimate implies a dimension-free Cheeger lower bound (KLS).
    depends_on: ['ass:stopped-centroid', 'lem:survival-implies-kls']

  - id: lem:matrix-riccati
    kind: lemma
    status: proved
    provenance: internal
    file: modules/kls/12-riccati.tex
    summary: 'Matrix two-color Riccati identity: $dB_t = dN_t + (sG^2 - AB - BA + rB)\,dt$; hence $dR = d\tilde{N} - (R^2 + sG^2)\,dt$.'
    proofs:
      - artifact: solutions/kls-localization-riccati-core.tex
        mode: agent
        review: research/reviews/2026-08-25-kls-core-r2-audit.md

  - id: thm:scalar-riccati
    kind: theorem
    status: proved
    provenance: internal
    file: modules/kls/12-riccati.tex
    summary: 'Scalar Riccati: $dr_t = dM_t + (S_t - D_t)\,dt$ with $S = s\|G\|^2$ the only positive source, $D \ge r^2$ coercive.'
    depends_on: ['lem:matrix-riccati']
    proofs:
      - artifact: solutions/kls-localization-riccati-core.tex
        mode: agent
        review: research/reviews/2026-08-25-kls-core-r2-audit.md

  - id: cor:per-direction
    kind: corollary
    status: proved
    provenance: internal
    file: modules/kls/12-riccati.tex
    summary: 'Unconditional per-direction Carleson: $\mathbb{E}\int_0^\infty s|G\theta|^2 \le \theta^T R_0 \theta \le 1$; i.e. $\mathbb{E}\int sG^2 \preceq R_0 \preceq I$.'
    depends_on: ['lem:matrix-riccati']
    proofs:
      - artifact: solutions/kls-localization-riccati-core.tex
        mode: agent
        review: research/reviews/2026-08-25-kls-core-r2-audit.md

  - id: cor:full-matrix-dissipation
    kind: corollary
    status: proved
    provenance: internal
    file: modules/kls/12-riccati.tex
    summary: 'The full Loewner dissipation estimate $\mathbb{E}\int_0^\infty (R_t^2 + s_t G_t^2)\,dt \le R_0$ holds before scalarization; discarding $R_t^2$ recovers the unconditional per-direction Carleson estimate, while taking a trace can still cost $n$.'
    depends_on: ['lem:matrix-riccati']
    proofs:
      - artifact: solutions/cor-full-matrix-dissipation.tex
        mode: agent
        review: research/reviews/2026-08-27-cor-full-matrix-dissipation-repair-proof-review.md

  - id: ass:all-cut-carleson
    kind: assumption
    status: open
    provenance: internal
    file: modules/kls/20-eldan-statements.tex
    summary: 'All-cut absorptive two-color Carleson: E ∫_I S_t ≤ C_0|I| + C_1 E ∫_I r_t + α E ∫_I D_t, α<1, every balanced cut.'
    heuristic_barriers: ['obs:two-tail', 'obs:relative-ceiling', 'obs:proj-ceiling']

  - id: ass:tight-prefix-carleson
    kind: assumption
    status: open
    provenance: internal
    file: modules/kls/20-eldan-statements.tex
    summary: 'There exist universal $\eta \in (0,1/6]$, $T_0,C_0,C_1$ and $\alpha<1$ such that every isotropic log-concave $\mu$, every fixed cut with $|\mu(E)-1/2| \le \eta/2$, and every $0<T\le T_0$ satisfy $\mathbb{E}\int_0^{T\wedge\tau_\eta} S_t\,dt \le C_0 T + C_1\,\mathbb{E}\int_0^{T\wedge\tau_\eta} r_t\,dt + \alpha\,\mathbb{E}\int_0^{T\wedge\tau_\eta} D_t\,dt$.'
    heuristic_barriers: ['obs:two-tail', 'obs:relative-ceiling', 'obs:proj-ceiling']

  - id: thm:carleson-implies-centroid
    kind: theorem
    status: open
    provenance: internal
    file: modules/kls/21-carleson.tex
    summary: All-cut Carleson implies the stopped centroid estimate (via Gronwall on E r_{t∧τ}), hence KLS.
    depends_on: ['ass:all-cut-carleson', 'thm:scalar-riccati', 'lem:survival-implies-kls']

  - id: cor:tight-window-consumption
    kind: corollary
    status: proved
    provenance: internal
    file: modules/kls/21-carleson.tex
    summary: An absorptive Carleson estimate on a fixed tight balance window yields universal balanced survival and hence a universal boundary lower bound for the cut.
    depends_on: ['thm:scalar-riccati', 'lem:survival-implies-kls']
    proofs:
