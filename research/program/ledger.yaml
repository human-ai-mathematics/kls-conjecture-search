  # ---------------------------------------------------------------------------
  # CMH NORMALIZATION AND EXACT CASES
  # ---------------------------------------------------------------------------
  - id: def:cmh
    kind: definition
    status: defined
    provenance: internal
    file: modules/kls/41-cmh-normalization.tex
    summary: 'The canonical moment-Hessian constant $C_{\mathrm{CMH}}(\mu)$ is the supremum over $g \in \mathrm{Dom}(A)\setminus\ker(A)$ of $\mathbb{E}\langle H\nabla g, \Sigma^{-1}H\nabla g\rangle$ divided by $\mathbb{E}(L_\mu g)^2$, where $L_\mu g = \mathrm{div}_\mu(H\nabla g) = \mathrm{Tr}(HD^2g) - p\cdot\nabla g$ is the Stein generator, $A=-L_\mu$, the space is $L^2(\mu)$, and every inverse is the pseudoinverse on the orthogonal complement of $\ker A$; $\Sigma^{-1}$ is the Moore--Penrose inverse on the affine tangent space for measures on a proper affine subspace.'

  - id: prop:cmh-bochner
    kind: proposition
    status: proved
    provenance: internal
    file: modules/kls/41-cmh-normalization.tex
    summary: 'Integrated Bochner identity for the Stein generator: $\mathbb{E}(L_\mu g)^2 = \mathbb{E}[\langle H\nabla g,\nabla g\rangle + \mathrm{Tr}(HD^2g\,HD^2g)]$.'
    depends_on: ['def:cmh']
    proofs:
      - artifact: solutions/thm-cmh-normalization.tex
        mode: agent
        review: research/reviews/2026-08-25-kls-cmh-normalization-repair-audit.md

  - id: thm:cmh-implies-affine-poincare
    kind: theorem
    status: proved
    provenance: internal
    file: modules/kls/41-cmh-normalization.tex
    summary: '$C_P^{\mathrm{aff}}(\mu) \le C_{\mathrm{CMH}}(\mu)$ for every centered log-concave $\mu$ in the regular moment-map class. Hence a universal bound $C_{\mathrm{CMH}} \le 4$ would prove the KLS conjecture with affine Poincare constant $4$.'
    depends_on: ['def:cmh']
    proofs:
      - artifact: solutions/thm-cmh-normalization.tex
        mode: agent
        review: research/reviews/2026-08-25-kls-cmh-normalization-repair-audit.md

  - id: prop:cmh-hodge
    kind: proposition
    status: proved
    provenance: internal
    file: modules/kls/41-cmh-normalization.tex
    summary: 'Let $A_1=-\mathrm{div}_\mu(\Sigma\nabla)$ be the closed covariance generator and $L^2_0=(\ker A_1)^\perp$. For $g\in\mathrm{Dom}(A)$ with $u=H\nabla g \in L^2(\mu;\Sigma^{-1})$, set $h=Ag=-\mathrm{div}_\mu u \in L^2_0$, $\psi=A_1^{-1}h$ with $A_1^{-1}: L^2_0 \to \mathrm{Dom}(A_1)\cap L^2_0$, and $w=u-\Sigma\nabla\psi$. Then $\Sigma\nabla\psi$ and $w$ are orthogonal in $L^2(\mu;\Sigma^{-1})$, the corresponding energies add exactly, and the supremum of $\langle h,A_1^{-1}h\rangle/\|h\|_2^2$ over nonzero $h\in L^2_0$ is $C_P^{\mathrm{aff}}(\mu)$.'
    depends_on: ['def:cmh']
    proofs:
      - artifact: solutions/thm-cmh-normalization.tex
        mode: agent
        review: research/reviews/2026-08-27-prop-cmh-hodge-domain-repair-proof-review.md

  - id: rem:cmh-stronger-than-kls
    kind: corollary
    status: proved
    provenance: internal
    file: modules/kls/41-cmh-normalization.tex
    summary: 'The Hodge identity gives $C_{\mathrm{CMH}}(\mu) \ge C_P^{\mathrm{aff}}(\mu)$ and identifies the difference as a nonnegative solenoidal channel, which vanishes identically in dimension one under the no-flux convention.'
    depends_on: ['prop:cmh-hodge', 'thm:cmh-1d']
    proofs:
