# research/program/editorial.yaml --- what a new reader sees first, and where they go next.
#
# This file is navigation, not mathematics. It holds identifiers, display names and
# manuscript anchors, and nothing else: no statement, no status, no gloss, no objective,
# no blocker. Every one of those already has exactly one home --- the manuscript, the
# ledger, the portfolio --- and a second copy here would drift from it the first time
# either changed, with the prettier copy winning the argument (CLAUDE.md constraint 7).
# `scripts/checks/guide.py` enforces that mechanically: the forbidden keys are refused,
# every id must resolve, and every anchor must be a \label the checker already found.
#
# What it does own is selection and order, which nothing else in the repository records.
# The ledger knows 138 claims and cannot say which fifteen a stranger should read; the
# portfolio knows 19 approaches and does not know that the manuscript groups them into
# four mathematical routes called E, S, C and F.

site:
  name: The KLS conjecture
  tagline: A universal Poincaré bound for isotropic log-concave measures, in every dimension.

# The four mathematical routes of the manuscript. Note the vocabulary: on this site a
# *route* is one of these four, and the 19 objects in the portfolio are *approaches*.
# The portfolio calls those `routes:` internally and that is left alone --- renaming a
# validated schema to fix a caption would be the tail wagging the dog --- but nothing a
# reader sees may call nineteen things by the name the manuscript gives to four.
routes:
  - code: E
    name: Fixed-cut stochastic localization
    families: [fam:eldan-localization]
    anchor: sec:introduction
  - code: S
    name: Fixed-eigenfunction localization
    families: [fam:mm-spectral]
    anchor: sec:spectral-route
  - code: C
    name: Canonical moment-Hessian and deterministic moment maps
    families: [fam:mm-cmh]
    anchor: sec:moment-map-cmh
  - code: F
    name: Conditional-fiber frames
    families: [fam:conditional-fiber]
    anchor: sec:conditional-fiber-frame

# Not a fifth route. These are registered probes that have not become one, and drawing
# them level with E, S, C and F would claim a standing the portfolio does not give them.
probes:
  name: Other probes
  families: [fam:novel-routes]

# Where the subject stands outside this repository, in the literature's own words.
frontier:
  - thm:klartag-logn
  - thm:letwin-qcts

# Fifteen of 138, chosen for what a reader needs to see first and tagged by the job each
# one does in the argument. The complete inventory stays one click away under Audit.
featured:
  - {id: thm:intro-all-cut, role: bridge, route: E}
  - {id: prop:spectral-sufficiency, role: bridge, route: S}
  - {id: thm:cmh-implies-affine-poincare, role: bridge, route: C}

  - {id: prop:mm-window-occupation, role: advance, route: S}
  - {id: thm:cmh-dirichlet, role: advance, route: C}
  - {id: lem:linear-sector-third-moment, role: advance, route: C}

  - {id: q:upgrade, role: bottleneck, route: E}
  - {id: q:mm-spectral-occupation, role: bottleneck, route: S}
  - {id: conj:gate-zero, role: bottleneck, route: C}
  - {id: q:conditional-fiber-frame, role: bottleneck, route: F}

  - {id: prop:weighted-spectator-obstruction, role: obstruction, route: E}
  - {id: obs:relative-ceiling, role: obstruction}

  - {id: ass:weighted-package, role: refuted, route: E}
  - {id: q:weighted, role: refuted, route: E}

  - {id: lem:fiber-root-degree-two, role: model, route: F}

# The manuscript's own hierarchy, in reading order. Anchors survive into the HTML
# conversion because site/tex4ht.cfg preserves every \label as an anchor of the same
# name, so these reach the section itself and not the file that holds it.
reading:
  - {label: How to read this document, anchor: sec:reading-paths}
  - {label: Part I — the problem and its frontier, anchor: sec:kls-orientation}
  - {label: What is already known, anchor: sec:kls-known}
  - {label: What remains, anchor: sec:kls-remaining}
  - {label: The frontier atlas, anchor: sec:frontier-atlas}
  - {label: Where each route stands, anchor: subsec:atlas-state}
  - {label: Fences — what is already ruled out, anchor: subsec:atlas-fences}
  - {label: Open targets, anchor: sec:open}
  - {label: Synthesis, anchor: sec:kls-synthesis}
  - {label: Glossary, anchor: sec:glossary}
