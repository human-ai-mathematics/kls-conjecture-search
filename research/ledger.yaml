    status: open
    file: modules/open-targets/A2-bernstein-von-mises.tex
    statement: "Target shape: under osc(r_n)=o_P(1) (a tail/no-bottleneck hypothesis), C_P(pi_n)=(1+o_P(1)) lambda_max(H_n^{-1}); same for C_LS, C_TCI."
    depends_on: [conj:a2]
    bounded_by: [obs:tv-insufficient]

  - id: q:a2-poincare
    kind: question
    status: open
    file: modules/open-targets/A2-bernstein-von-mises.tex
    statement: "Weakest posterior assumptions for n C_P(pi_n) -> lambda_max(I^{-1}): the random-posterior version of the Chewi-Stromme low-temperature limit eq:a2-cs-poincare, with a clean tail condition."
    depends_on: [conj:a2]
    numerics: "Confirm the limit across regular logistic/Poisson over n; estimate the o_P(1) rate."

  - id: q:a2-lsi
    kind: question
    status: open
