  # =========================================================================
  # A5 — quotient and reparameterization constants
  # =========================================================================

  - id: thm:a5-monotone
    kind: theorem
    status: proved
    file: modules/open-targets/A5-quotient-and-reparameterization.tex
    statement: "Quotient constants are never worse: C_P(pi/G) <= C_P(pi), same for C_LS, C_TCI, under the quotient metric and Dirichlet form."
    numerics: "Sanity: estimated quotient C_P <= raw C_P on G-invariant posteriors."

  - id: prop:a5-ratio
    kind: proposition
    status: proved
    file: modules/open-targets/A5-quotient-and-reparameterization.tex
    statement: "Quotient improvement ratio: C_P(pi)/C_P(pi/G) = lambda_inv / min(lambda_inv, lambda_noninv). Quotient helps iff the slowest mode is non-invariant."
    depends_on: [thm:a5-monotone]
    unlocks: [obs:symmetry-vs-physical]

  - id: conj:a5-metastable
    kind: conjecture
    status: open
    file: modules/open-targets/A5-quotient-and-reparameterization.tex
    statement: "Raw-vs-quotient metastability: C_P(pi_Theta) ~ e^{n Gamma} poly(n) while C_P(pi_{Theta/S_K}) = (1+o_P(1))/n lambda_max(I(theta_*)^{-1})."
    bounded_by: [obs:symmetry-vs-physical]
    depends_on: [prop:a5-ratio]
    related: [conj:a2, q:a4-multimodal]
    unlocks: [q:a5-qbvm, q:a5-metastable, q:a5-detect, q:a5-stratified, q:a5-reparam]
    numerics: "Folded vs raw separated mixture: estimate both constants; raw ~ exp barrier, quotient ~ 1/n Fisher scale."
