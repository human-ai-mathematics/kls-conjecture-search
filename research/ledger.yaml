    statement: "Certified VB error bars at posterior scale: C_{Q,r}(pi) <~ lambda_max(A_Wbar^{-1}) + tail on a KL sublevel; C_mean,Q <= sup_u K(u). Yields W2 and posterior-mean certificates given a KL upper bound."
