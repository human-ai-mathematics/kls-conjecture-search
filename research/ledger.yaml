  - id: conj:a3
    kind: conjecture
    status: open
    file: modules/open-targets/A3-heavy-tailed-posteriors.tex
    statement: "Tail-index-dependent weighted Poincare: Var_pi(f) <= C_w sum_j int a_j |d_j f|^2 dpi, a_j ~ tau^2+theta_j^2, with C_w from 1D Hardy and tail scaling C_w ~ max_j alpha_j^{-2}."
    bounded_by: [obs:heavy-tail-no-classical, obs:flat-direction]
    depends_on: [thm:hardy-1d, thm:a3-student]
    related: [conj:a4]
    unlocks: [q:a3-student, q:a3-horseshoe, q:a3-catalogue, q:a3-weak, q:a3-hierarchical]
    numerics: "Evaluate the Hardy certificate numerically; check tail scaling C_w ~ alpha^{-2}; verify weighted PI holds where classical fails."
    target_doc: research/targets/A3-heavy-tailed-posteriors.md

  - id: thm:a3-student
    kind: imported
    status: imported
    file: modules/open-targets/A3-heavy-tailed-posteriors.tex
    statement: "Sharp weighted Poincare for generalized Cauchy / Student-t (Huguet 2024; Bonnefont-Joulin-Ma 2016): explicit optimal spectral gap lambda_{beta,d}. The A3 calibration theorem."
    related: [conj:a3, q:a3-student]
    numerics: "Calibration oracle: numerical weighted spectral gap must match the closed-form lambda_{beta,d}."

  - id: prop:a3-horseshoe
    kind: proposition
    status: conjectured
    file: modules/open-targets/A3-heavy-tailed-posteriors.tex
    statement: "Hardy-certified weighted Poincare for the horseshoe marginal with weight tau^2+theta^2; B_HS <= C_HS <= 4 B_HS. Finiteness proved; sharp C_HS open (q:a3-horseshoe)."
    depends_on: [thm:hardy-1d]
    bounded_by: [obs:heavy-tail-no-classical]
    numerics: "Numerically evaluate B_HS(tau) and a sample-based weighted spectral gap; locate C_HS within the factor-4 bracket."

