# ledger.yaml — canonical state of the open-target program (Parts I & II)
# =============================================================================
# SINGLE SOURCE OF TRUTH for what is open / conjectured / proved / refuted among
# the Bayesian-posterior open targets (A1-A5), and for the dependency edges and
# the obstructions that constrain them. The LaTeX in modules/open-targets/ is the
# prose+statement; this file is the machine-readable graph.
#
# Every node `id` is the LaTeX \label of the statement (use it with \ref). When a
# statement is refined, validated, refuted, or proved, update BOTH the .tex and
# this file.
#
# WORKFLOW (two phases):
#   Phase 1 (now)   refine the open statement into a sharp, precise theorem and
#                   stress-test it numerically (finum). Output: status=conjectured
#                   with evidence=numerical-strong.
#   Phase 2 (later) prove it (natural language first; Lean deferred).
#
# status  (logical state):
#   open           stated in the manuscript, not yet refined into a sharp claim
#   conjectured    a precise, sharp statement exists (refinement done)
#   proved         fully proved here (Phase 2)
#   imported       taken from the literature with a citation (a calibration anchor)
#   refuted        the stated form shown false (numerically or by counterexample)
#
# evidence (numerical support, ORTHOGONAL to status — "seems valid numerically"):
#   none                   no numerical test yet
#   numerical-directional  limited / exploratory tests
#   numerical-strong       passed the shared stress battery (knowledge/instances.md)
#   evidence_run:          path to the provenance-stamped finum artifact (when set)
#
# kind: theorem|proposition|lemma|corollary|conjecture|question|obstruction|
#       baseline|example|imported
#
# edges:
#   depends_on   ids used in the proof — MUST stay acyclic
#   unlocks      ids that become reachable once this is established
#   bounded_by   obstruction ids (obs:*) that any valid statement/proof must respect
#   related      cross-target links (non-logical)
#   refines      the manuscript node this is the working/sharpened version of
#   numerics     what finum should compute to validate/refute/refine this node
#
# INVARIANTS (python3 research/check_ledger.py):
#   1. every id in depends_on/unlocks/bounded_by/related/refines exists
#   2. depends_on is acyclic
#   3. no `proved` node depends_on an `open`/`conjectured`/`refuted` node
#   4. every bounded_by id is a node with kind: obstruction
#   5. evidence is one of the allowed values; numerical-strong requires evidence_run
# =============================================================================

meta:
  program: ab
  scope: "Parts I & II — Bayesian-posterior functional-inequality constants (A1-A5)"
  goal: "Refine the open targets into sharp, numerically-validated theorems for later proof."
  kls_note: "Part III (KLS) has its own ledger at research/kls/ledger.yaml (program: kls), a proof-phase program with its own no-go machinery. Bridged here via conj:a1-bis."

# ===========================================================================
# CROSS-CUTTING OBSTRUCTIONS  (the shared no-go knowledge; prose + numerical
# demonstration live in knowledge/obstructions.md)
# ===========================================================================
nodes:

  - id: obs:flat-direction
    kind: obstruction
    status: proved
    file: modules/05-tier3-glm.tex
    statement: "No global data-curvature floor: GLM likelihood curvature ell'' vanishes where |x^T theta|->inf, so any data-informed bound MUST carry a tail/penalty term."
    refines: prop:flat-prior-nonintegrable
    related: [conj:a1, conj:a3, q:a5-reparam]
    numerics: "Separable logistic: lambda_max(Cov) (=C_P lower bound) blows up while the bulk term stays small => a tail-free bound is FALSIFIED."
    evidence_run: research/runs/2026-06-20-A1.jsonl  # finum: stress-logit-separable REFUTES the tail-free bound; prior bound stays consistent

  - id: obs:heavy-tail-no-classical
    kind: obstruction
    status: imported
    file: modules/06-tier4-heavy-tails.tex
    statement: "Polynomial/exponential tails admit no classical LSI, no T2, and (heaviest tails) no classical Poincare; the correct object is a weighted/weak inequality."
    related: [conj:a3, conj:a4, obs:restricted-not-finite]
    numerics: "Generalized-Cauchy mu_beta: unweighted Hardy functional ~ x^2 -> inf (C_P=inf); weighted by (1+x^2) -> O(1)."
    evidence_run: research/runs/2026-06-20-A3.jsonl  # finum A3: cal-cauchy weighted gap == 1/lambda_{beta,d}; Student-t classical diverges, weighted finite

  - id: obs:tv-insufficient
    kind: obstruction
    status: proved
    file: modules/open-targets/A2-bernstein-von-mises.tex
    statement: "TV-closeness to the BvM Gaussian does NOT control the constants: a contamination sequence with ||mu_n - N(0,1)||_TV -> 0 can have C_P -> inf."
    refines: warn:a2-tv-fails
    related: [conj:a2]
    numerics: "mu_n=(1-eps_n)N(0,1)+eps_n N(a_n,1), eps_n a_n^2 -> inf: linear test C_P >= Var -> inf while TV -> 0."
    evidence_run: research/runs/2026-06-20-A2.jsonl  # finum A2: contamination REFUTES "BvM(TV)=>constants"; n*C_P -> lambda_max(I^{-1})

  - id: obs:symmetry-vs-physical
    kind: obstruction
    status: proved
    file: modules/open-targets/A5-quotient-and-reparameterization.tex
    statement: "Multimodality blow-up is removable by the symmetry quotient iff the slow eigenfunction is non-invariant (label switching); invariant slow modes (physical multimodality) survive quotienting."
    refines: prop:a5-ratio
    related: [q:a2-multimodal, q:a4-multimodal, conj:a5-metastable]
    numerics: "Folded double well (ex:a5-folding): odd test fn gives C_P >~ e^{a^2/2sigma^2} for raw, O(sigma^2) for quotient."
    evidence_run: research/runs/2026-06-20-A5.jsonl  # finum A5: folded-well raw C_P >> folded (exp barrier); Neal centered >> non-centered max{s^2,1}

  - id: obs:restricted-not-finite
    kind: obstruction
    status: proved
    file: modules/open-targets/A4-variational-inference.tex
    statement: "Family-restricted transport constant C_Q is not automatically finite: for pi ~ e^{-|x|^p}, p<2, even mean-field Gaussian Q gives C_Q = inf; finiteness needs KL-sublevel restriction, bounded Q, or a modified cost."
    refines: warn:a4-heavytail
    related: [conj:a4, conj:a3]
    numerics: "q_m=N(m,sigma^2), pi~e^{-|x|^p}: W2^2/KL ~ |m|^{2-p} -> inf as |m|->inf."
    evidence_run: research/runs/2026-06-20-A4.jsonl  # finum A4: ep-tails global C_Q REFUTED (>> restricted C_{Q,r}); Gaussian T2 ratio == sigma^2

  # =========================================================================
  # SHARED TOOLS / BASELINES  (lemmas reused across targets; see knowledge/lemmas.md)
  # =========================================================================

  - id: lem:linear-test-lower
    kind: lemma
    status: proved
    file: modules/05-tier3-glm.tex
    statement: "Linear-test lower bound: C_P(pi) >= lambda_max(Cov_pi); any test function f gives Var(f)/E||grad f||^2 <= C_P. The universal sound refuter."
    refines: rem:rayleigh-lower-only
    related: [conj:a1, conj:a2, q:a4-mean, q:a5-detect]
    numerics: "finum.constants.poincare_lower(samples) = lambda_max(empirical cov)."

  - id: thm:glm-fi
    kind: baseline
    status: proved
    file: modules/05-tier3-glm.tex
    statement: "Data-free GLM bound: C_P <= C_LS <= lambda_max(Sigma0), C_TCI <= lambda_max(Sigma0); dimension-free, data-free. The trivial baseline any A1/A4 bound must beat."
    related: [conj:a1, conj:a4]

  - id: thm:hardy-1d
    kind: imported
    status: imported
    file: modules/02-results-toolkit.tex
    statement: "1D weighted Hardy/Muckenhoupt criterion: weighted Poincare holds iff the Hardy quantities B_+,B_- are finite, pinning the optimal constant up to factor 4."
    related: [conj:a3, prop:a3-horseshoe]
    numerics: "finum can evaluate the Hardy supremum sup_x mu([x,inf)) int^x dt/(a(t)p(t)) numerically."

  - id: lem:a5-lipschitz
    kind: lemma
    status: proved
    file: modules/open-targets/A5-quotient-and-reparameterization.tex
    statement: "Lipschitz transport: T_# nu = mu with T globally L-Lipschitz => C_P(mu) <= L^2 C_P(nu), same for C_LS, C_TCI."
    related: [q:a5-reparam]

  # =========================================================================
  # A1 — data-informed GLM Poincare constant
  # =========================================================================

  - id: conj:a1
    kind: conjecture
    status: open
    file: modules/open-targets/A1-data-informed-glm.tex
    statement: "Data-informed GLM Poincare: C_P(pi) <= C{ lambda_max(A_Wbar^{-1}) + E_pi[lambda_max(H^{-1}); G_Wbar^c] } <= C{ lambda_max(A_Wbar^{-1}) + lambda_max(Sigma0) pi(G_Wbar^c) }."
    bounded_by: [obs:flat-direction]
    depends_on: [thm:glm-fi]
    related: [conj:a2, conj:a4]
    unlocks: [q:a1-poincare, q:a1-barw, q:a1-tail, q:a1-sharp, q:a1-lsi, q:a1-sampling]
    numerics: "Check the bound holds vs lem:linear-test-lower across instances; tightness ratio; beats thm:glm-fi baseline; bulk-dominated vs separable regimes."
    target_doc: research/targets/A1-data-informed-glm.md

  - id: q:a1-poincare
    kind: question
    status: open
    file: modules/open-targets/A1-data-informed-glm.tex
    statement: "Prove conj:a1 for C_P: specialize Brascamp-Lieb + log-concave self-improvement (cattiaux2018) to the GLM Hessian; make the universal constant explicit."
    depends_on: [conj:a1]
    numerics: "Estimate the realized universal constant C from data; check C is O(1) and stable across instances."

  - id: q:a1-barw
    kind: question
    status: open
    file: modules/open-targets/A1-data-informed-glm.tex
    statement: "Construct a computable data-informed Wbar from (X,y,Sigma0): compare rowwise (eq:a1-rowwise), posterior-quantile, and spectral weights; spectral X^T W X >= X^T Wbar X is the less conservative object."
    depends_on: [conj:a1]
    numerics: "For each Wbar recipe compute the bound + pi(G_Wbar^c); pick the recipe minimizing the certified bound."

  - id: q:a1-tail
    kind: question
    status: open
    file: modules/open-targets/A1-data-informed-glm.tex
    statement: "Certify pi(G_Wbar^c) <= eps with computable data-dependent constants (posterior concentration / finite-sample Laplace / self-improving bootstrap). The heart of A1."
    depends_on: [conj:a1, q:a1-barw]
    bounded_by: [obs:flat-direction]
    numerics: "MCMC estimate of pi(G_Wbar^c); does the claimed eps hold? cross-check by independent sampler."

  - id: q:a1-sharp
    kind: question
    status: open
    file: modules/open-targets/A1-data-informed-glm.tex
    statement: "Get the correct 1/n scaling in the likelihood-dominated regime, matching the A2 limit eq:a2-target as n->inf; validate against lem:linear-test-lower and sample-based C_P estimators."
    depends_on: [q:a1-poincare]
    related: [thm:a2-target]
    numerics: "Sweep n; check n * bound -> lambda_max(I^{-1}); A1<->A2 consistency gap."

  - id: q:a1-lsi
    kind: question
    status: open
    file: modules/open-targets/A1-data-informed-glm.tex
    statement: "Data-informed C_LS via local LSI on the bulk glued to prior drift (eq:a1-lsi-target), then C_TCI via Otto-Villani. The genuinely harder second stage."
    depends_on: [conj:a1]
    bounded_by: [obs:flat-direction]
    related: [q:a2-lsi]
    numerics: "Estimate C_LS (entropy-based); does the clean bulk bound hold or is a Phi(pi(G^c)) factor needed?"

  - id: q:a1-sampling
    kind: question
    status: open
    file: modules/open-targets/A1-data-informed-glm.tex
    statement: "Translate data-informed constants into Langevin/MALA complexity and posterior-concentration rates."
    depends_on: [q:a1-poincare]

  - id: conj:a1-bis
    kind: conjecture
    status: open
    file: modules/08-open-targets.tex
    statement: "Structured-posterior KLS: C_P(pi) <= K lambda_max(Cov_pi) for a useful class of GLM posteriors, K universal or mildly geometry-dependent — the finite-sum-structured counterpart of KLS."
    bounded_by: [obs:flat-direction]
    depends_on: [conj:a1]
    related: [conj:a2, conj:a4]
    bridges: [kls/thm:intro-all-cut]
    numerics: "Estimate the realized K = C_P_lower / lambda_max(Cov) across GLM instances; test whether K stays O(1) and mildly geometry-dependent (the structured shadow of the KLS universal constant)."
    note: "Bridge to Part III: the SAME bound for EVERY isotropic log-concave measure with K universal IS the KLS conjecture (research/kls/). A1-bis is the structured, finite-sum case the KLS machinery does not exploit."

  # =========================================================================
  # A2 — asymptotic constants via Bernstein-von Mises
  # =========================================================================

  - id: conj:a2
