[project]
name = "numerics"
version = "0.1.0"
description = "Numerical channel for the KLS program: refine statements and gate or refute proof routes. Refutes and directs; never proves."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",   # eigh_tridiagonal for the 1D weighted-Poincare FEM gap
]

[project.scripts]
numerics = "numerics.__main__:main"

[dependency-groups]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["numerics"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
# The slow lane is opt-in, so `uv run pytest` stays fast and scripts/check.sh can
# invoke it unchanged. Run the other lane with `uv run pytest -m slow`.
addopts = "-q -m 'not slow'"
markers = [
    "slow: expensive Monte Carlo or high-resolution numerical regression",
]
